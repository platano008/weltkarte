name: Russland-Daten
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/russland.sh, tools/russland.py]
permissions:
  contents: write
jobs:
  daten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh tools/russland.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add daten/russland.geojson
          git diff --cached --quiet || (git commit -m "Russland mit Föderationssubjekten (Natural Earth)" && git pull --rebase && git push)
