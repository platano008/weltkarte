name: Vorschaubilder Kartenansicht
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/vorschau.js]
permissions:
  contents: write
jobs:
  bilder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/vorschau.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add bild/ansicht
          git diff --cached --quiet || (git commit -m "Vorschaubilder der Kartenansichten neu gerendert" && git pull --rebase && git push)
