/* Touch: Zoomen geht mit zwei Fingern – Zoom-Knöpfe weg, weniger auf dem Bildschirm */

.card{animation:cardIn .22s cubic-bezier(.2,.9,.25,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.card .big{display:flex;align-items:center;justify-content:center;min-height:76px;background:var(--surface-2);border:1px solid var(--line)}

.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#000;transition:opacity .4s}
.loading.done{opacity:0;pointer-events:none}
.loading div{display:flex;flex-direction:column;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.loading b{display:block;width:140px;height:2px;background:var(--line-2);position:relative;overflow:hidden}
.loading b::after{content:"";position:absolute;inset:0;width:40%;background:var(--volt);animation:load 1s ease-in-out infinite}

/* ===== Bedienung: ruhige dunkle Flächen, dünne Ränder, kein Leuchten ===== */
:root{--glow:255,255,255;--flaeche:rgba(14,15,18,.58);--rand:rgba(255,255,255,.16);--rund:12px}
/* Bedienung leicht durchsichtig: Glas mit Unschärfe; auf Touch-Geräten (ohne Unschärfe) etwas dichter */
.tools-knopf,.dock button,.wz-gruppe,.wz-zu,.an-bilder,.an-rund,.pille,.panel,.card,.wz-box,.tl,.maplibregl-ctrl-group{-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
@media (hover:none),(pointer:coarse){:root{--flaeche:rgba(14,15,18,.72)}}
.maplibregl-map{font-family:var(--body)!important}
/* Quellenangaben: klein unten links, aufklappbar über das „i“ */
.maplibregl-ctrl-bottom-left{bottom:calc(var(--unter-leiste,0px) + env(safe-area-inset-bottom) + 4px)!important;left:max(6px,env(safe-area-inset-left))!important}
.maplibregl-ctrl-attrib{font-family:var(--mono)!important;font-size:9.5px!important;letter-spacing:.02em;background:var(--flaeche)!important;color:#8a8a8a!important;border-radius:var(--rund)!important;margin:0 0 4px!important}
.maplibregl-ctrl-attrib a{color:#b5b5b5!important}
.maplibregl-ctrl-attrib.maplibregl-compact{min-height:22px}
.maplibregl-ctrl-attrib-button{filter:invert(1);opacity:.55}
.maplibregl-ctrl-scale{font-family:var(--mono)!important;font-size:9.5px!important;background:var(--flaeche)!important;color:#9a9a9a!important;border-color:#666!important;border-width:0 1px 1px!important;margin:0 0 4px!important}
.mt-logo{left:auto!important;right:max(8px,env(safe-area-inset-right))!important;bottom:calc(env(safe-area-inset-bottom) + 8px)!important;opacity:.7}
.mt-logo img{width:62px!important}
/* Knöpfe und Kästen */
.maplibregl-ctrl-group,.wz-box,.tl{background:var(--flaeche)!important;border:1px solid var(--rand)!important;border-radius:var(--rund)!important;overflow:hidden;box-shadow:0 8px 24px -12px rgba(0,0,0,.8)!important}
.maplibregl-ctrl-group button{background:transparent!important;border-color:rgba(255,255,255,.07)!important;color:#d9d9d9!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)!important;opacity:.85}
.maplibregl-ctrl-group button:hover{background:rgba(255,255,255,.07)!important}
/* Liste der Veränderungen: Blatt über der Pille */
body .panel{left:50%!important;right:auto!important;top:auto!important;bottom:calc(env(safe-area-inset-bottom) + 76px)!important;width:min(430px,calc(100vw - 24px))!important;max-height:min(56vh,540px)!important;
  border:1px solid var(--rand)!important;border-radius:16px!important;overflow:hidden;padding:0!important;background:var(--flaeche)!important;box-shadow:0 20px 50px -20px rgba(0,0,0,.85)!important;
  opacity:0!important;visibility:hidden!important;pointer-events:none!important;transform:translate(-50%,12px)!important;
  transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s!important}
body.k-auf .panel{opacity:1!important;visibility:visible!important;pointer-events:auto!important;transform:translate(-50%,0)!important;transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s!important}
.panel .ph{padding:14px 18px 10px!important;border-bottom:1px solid rgba(255,255,255,.07)!important;cursor:default!important}
.panel .list{overflow-y:auto!important;display:block!important}
.panel .item{border-color:rgba(255,255,255,.06)!important}
.panel .item:hover{background:rgba(255,255,255,.05)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* die Pille unten in der Mitte; die dünne Linie oben zeigt, wer zuletzt vorgerückt ist */
.pille{position:fixed;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:48px;padding:0 16px 0 15px;
  border:1px solid var(--rand);border-radius:999px!important;color:#fff;cursor:pointer;background:var(--flaeche);box-shadow:0 10px 30px -14px rgba(0,0,0,.9),inset 0 2px 0 -0.5px rgba(var(--glow),.85)}
.pille .szug-k{height:17px;width:auto;color:#fff}
.pille .chev{width:13px;height:13px;opacity:.6;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
body.k-auf .pille .chev{transform:rotate(180deg)}
.tl{bottom:calc(env(safe-area-inset-bottom) + 92px)!important}
@media (max-width:720px){
  .tl{left:12px!important;right:66px!important}
}

/* ===== Tools oben mittig: ein Knopf, der sich in die Werkzeug-Symbole auffächert ===== */
.tools{position:fixed;z-index:9;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;justify-content:center}
.tools-knopf{height:42px;padding:0 22px;border:1px solid var(--rand);border-radius:999px!important;background:var(--flaeche);color:#fff;font:600 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 28px -14px rgba(0,0,0,.9);animation:tEin .3s cubic-bezier(.2,.8,.2,1) both}
.tools-knopf:hover{border-color:rgba(255,255,255,.4)}
body.t-auf .tools-knopf,body:not(.t-auf) .dock,body.d-wz .dock,body.d-ansicht .dock,body.d-ebenen .dock{display:none}
.dock{display:flex;gap:8px}
.dock button{position:relative;width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid var(--rand);border-radius:999px!important;background:var(--flaeche);color:#e2e2e2;cursor:pointer;box-shadow:0 10px 28px -14px rgba(0,0,0,.9);animation:tEin .34s cubic-bezier(.2,.8,.2,1) both}
.dock button[hidden]{display:none}
.dock button:nth-child(2){animation-delay:.05s}.dock button:nth-child(3){animation-delay:.1s}.dock button:nth-child(4){animation-delay:.15s}.dock button:nth-child(5){animation-delay:.2s}
.dock button:hover{border-color:rgba(255,255,255,.4)}
.dock button.on{background:#fff;color:#000;border-color:#fff}
.dock svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.dock [data-x=zu]{color:#9a9a9a}
.dock .dot{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%!important;background:#ffb800;display:none}
body.tl-old .dock .dot{display:block}
@media (max-width:720px),(hover:none){.dock [data-aufnahme]{display:none}}
@keyframes tEin{from{opacity:0;transform:translateY(-12px) scale(.85)}}
/* Messen: oben mittig – Päckchen Lineal/Fläche/Radius/Koordinate, abgesetzt Sichtfeld/Fahrzeug, dann Löschen, ganz rechts × (zurück zu den Tools) */
.wz-rail{position:fixed;z-index:9;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);display:none;align-items:center;gap:8px}
body.d-wz .wz-rail{display:flex}
.wz-rail .wz-zu,.wz-gruppe{border:1px solid var(--rand);border-radius:999px!important;background:var(--flaeche);box-shadow:0 10px 28px -14px rgba(0,0,0,.9);animation:tEin .34s cubic-bezier(.2,.8,.2,1) both}
.wz-gruppe{display:flex;overflow:hidden}
.wz-rail > :nth-child(2){animation-delay:.05s}.wz-rail > :nth-child(3){animation-delay:.1s}.wz-rail > :nth-child(4){animation-delay:.15s}
.wz-rail button{width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;background:none;color:#e2e2e2;cursor:pointer}
.wz-gruppe button:hover{background:rgba(255,255,255,.08)}
.wz-gruppe button.on{background:#fff;color:#000}
.wz-rail svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.wz-rail .wz-zu{color:#9a9a9a}
@media (max-width:420px){.wz-rail{gap:5px}.wz-rail button{width:39px;height:40px}.wz-rail svg{width:18px;height:18px}}
/* Optionen der Werkzeuge und Ansicht: mittig unter der Leiste */
@media (min-width:721px){.wz-box{top:calc(max(14px,env(safe-area-inset-top)) + 56px)!important;bottom:auto!important;left:50%!important;right:auto!important;transform:translateX(-50%);width:min(340px,calc(100vw - 24px))!important}}
.maplibregl-ctrl-top-right{top:max(14px,env(safe-area-inset-top))!important}
.card{background:var(--flaeche)!important;border-color:var(--rand)!important}
@media (min-width:721px){.card{right:max(16px,env(safe-area-inset-right))!important;top:calc(max(14px,env(safe-area-inset-top)) + 56px)!important}}
/* Leiste „Neueste Gewinne“ */
.k-titel{margin:0;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em}
.k-alle{display:block;margin:10px 14px 14px;padding:11px;border:1px solid var(--rand);border-radius:999px!important;color:#fff;text-align:center;text-decoration:none;font:600 11.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.k-alle:hover{background:rgba(255,255,255,.08)}
/* ===== Ansicht: erst Vorschaubilder der Kartenarten, nach der Wahl Globus/Flach/3D als Symbole; ganz rechts × zurück ===== */
.ansicht{position:fixed;z-index:9;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:8px;max-width:calc(100vw - 16px)}
body.d-ansicht .ansicht{display:flex}
.an-zeile{display:flex;align-items:flex-start;gap:8px}
.an-bilder{display:flex;gap:6px;padding:6px;border:1px solid var(--rand);border-radius:20px!important;background:var(--flaeche);box-shadow:0 10px 28px -14px rgba(0,0,0,.9);animation:tEin .34s cubic-bezier(.2,.8,.2,1) both}
.an-bilder button{width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 0 4px;border:0;background:none;color:#cfcfcf;cursor:pointer;font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;animation:tEin .34s cubic-bezier(.2,.8,.2,1) both}
.an-bilder button:nth-child(2){animation-delay:.04s}.an-bilder button:nth-child(3){animation-delay:.08s}.an-bilder button:nth-child(4){animation-delay:.12s}.an-bilder button:nth-child(5){animation-delay:.16s}
.an-bild{display:block;width:100%;height:64px;border-radius:14px!important;overflow:hidden;background:linear-gradient(135deg,#2b2f36,#16181c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:box-shadow .2s,transform .2s}
.an-bild img{display:block;width:100%;height:100%;object-fit:cover}
.an-bild img:not([src]){visibility:hidden}
.an-bilder button:hover .an-bild{transform:translateY(-2px)}
.an-bilder button.on{color:#fff}
.an-bilder button.on .an-bild{outline:2px solid #fff;outline-offset:-2px}
.an-sym{display:none;align-items:center;gap:8px}
.ansicht.gewaehlt .an-bilder{display:none}
.ansicht.gewaehlt .an-sym{display:flex}
.an-rund{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid var(--rand);border-radius:999px!important;background:var(--flaeche);color:#e2e2e2;cursor:pointer;box-shadow:0 10px 28px -14px rgba(0,0,0,.9);animation:tEin .34s cubic-bezier(.2,.8,.2,1) both}
.an-rund[hidden]{display:none}
.an-rund:hover{border-color:rgba(255,255,255,.4)}
.an-rund.on{background:#fff;color:#000;border-color:#fff}
.an-rund svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.an-sym .an-rund:nth-child(2){animation-delay:.05s}.an-sym .an-rund:nth-child(3){animation-delay:.1s}.an-sym .an-rund:nth-child(4){animation-delay:.15s}
.an-jetzt{padding:3px}
.an-jetzt img{display:block;width:100%;height:100%;border-radius:50%!important;object-fit:cover}
.an-x{color:#9a9a9a;animation-delay:.2s}
/* Ein Knopf je Umschalter: er zeigt, wohin man wechselt (Globus ↔ flach, Sonne ↔ Mond) */
#view .i-globus,#view.flach .i-flach,#licht .i-sonne,#licht.dunkel .i-mond{display:none}
#view.flach .i-globus,#licht.dunkel .i-sonne{display:block}
@media (max-width:520px){.an-bilder{gap:4px;padding:5px;border-radius:16px!important}.an-bilder button{width:54px;font-size:7.5px;letter-spacing:0}.an-bild{height:54px;border-radius:12px!important}.an-zeile{gap:6px}}
/* Beta-Hinweis am Handy oben unter der Leiste – unten liegt dort das Werkzeugfeld */
@media (max-width:720px){.beta{top:calc(max(14px,env(safe-area-inset-top)) + 56px);bottom:auto!important}}
/* ===== Ebenen: Kacheln wie bei der Ansicht – an = hell, aus = gedimmt ===== */
.ebenen{position:fixed;z-index:9;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);display:none;align-items:flex-start;gap:8px;max-width:calc(100vw - 16px)}
body.d-ebenen .ebenen{display:flex}
.eb-kacheln{display:flex;gap:6px;padding:6px;border:1px solid var(--rand);border-radius:20px!important;background:var(--flaeche);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 28px -14px rgba(0,0,0,.9);animation:tEin .34s cubic-bezier(.2,.8,.2,1) both}
.eb-kacheln button{width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 0 4px;border:0;background:none;color:#8a8a8a;cursor:pointer;font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;animation:tEin .34s cubic-bezier(.2,.8,.2,1) both;transition:color .2s}
.eb-kacheln button:nth-child(2){animation-delay:.04s}.eb-kacheln button:nth-child(3){animation-delay:.08s}.eb-kacheln button:nth-child(4){animation-delay:.12s}
.eb-bild{width:100%;height:56px;display:grid;place-items:center;border-radius:14px!important;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);opacity:.45;transition:opacity .2s,background .2s,box-shadow .2s}
.eb-bild svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.eb-farbe{width:28px;height:28px;border-radius:8px!important}
.eb-farbe.ua{background:rgba(0,112,192,.55);box-shadow:inset 0 0 0 2px #0070c0}
.eb-farbe.ru{background:rgba(255,118,118,.45);box-shadow:inset 0 0 0 2px #fb3838}
.eb-kacheln button.on{color:#fff}
.eb-kacheln button.on .eb-bild{opacity:1;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px #fff}
.ebenen .an-x{animation-delay:.16s}
@media (max-width:520px){.eb-kacheln{gap:4px;padding:5px;border-radius:16px!important}.eb-kacheln button{width:62px;font-size:8.5px;letter-spacing:.02em}.eb-bild{height:50px;border-radius:12px!important}}
/* Zurück zur Startseite: oben links */
.heim{position:fixed;z-index:9;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--rand);border-radius:999px!important;background:var(--flaeche);color:#e2e2e2;box-shadow:0 10px 28px -14px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.heim:hover{border-color:rgba(255,255,255,.4)}
.heim svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){body.d-ansicht .heim,body.d-wz .heim,body.d-ebenen .heim{display:none}}
/* ===== Ladeanimation: schwarz und schlicht, nur der Schriftzug bewegt sich ===== */
.loading.done{opacity:0;transition:opacity .5s .2s}
.ld-mitte{display:flex;flex-direction:column;align-items:center;gap:26px}
.ld-wort{width:min(300px,62vw)}
.ld-svg{display:block;width:100%;height:auto;overflow:visible;color:#fff}
.ld-svg .lb{transform-box:fill-box;transform-origin:50% 100%;animation:ldEin .8s cubic-bezier(.2,.8,.2,1) both,ldWelle 2.4s ease-in-out infinite}
.ld-svg .l1{animation-delay:0s,.9s}.ld-svg .l2{animation-delay:.08s,1.05s}.ld-svg .l3{animation-delay:.16s,1.2s}.ld-svg .l4{animation-delay:.24s,1.35s}.ld-svg .l5{animation-delay:.32s,1.5s}
@keyframes ldEin{from{opacity:0;transform:translateY(40%) skewX(-12deg)}to{opacity:1;transform:none}}
@keyframes ldWelle{0%,60%,100%{transform:none;opacity:1}20%{transform:translateY(-12%);opacity:.55}}
.ld-info b{display:block;width:120px;height:2px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.ld-info b::after{content:"";position:absolute;inset:0;width:35%;background:#fff;animation:load 1s ease-in-out infinite}
.loading.done .ld-wort{transform:translateY(-10px);opacity:0;transition:transform .5s,opacity .4s}
@media (prefers-reduced-motion:reduce){.loading *{animation:none!important}}
/* Tablets/Handys: keine Unschärfe hinter Glas, stattdessen dunkler – spart viel Rechenleistung */
@media (hover:none),(pointer:coarse){
  *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
.item.alt .cq{opacity:.35}.item.alt b{color:#a9a9a9}

<script>
const K = Karte, $ = id => document.getElementById(id), esc = K.esc;
const GROUPS = {symbol:"Symbole", linie:"Linien & Pfeile", flaeche:"Flächen"};
const groupOf = el => el.typ==="pfeil" ? "linie" : el.typ;
const active = new Set(Object.keys(GROUPS));
let DATA = K.emptyData(), sel = null, markers = [];
const mq = window.matchMedia("(max-width:720px)");

/* Tools oben mittig: der Knopf fächert sich in Ansicht, Messen, Verlauf (und am PC Aufnahme) auf.
   Immer nur ein Menü offen, damit nichts übereinander liegt. */
function setDock(name){
  ["ansicht","ebenen","wz","tl"].forEach(n=>{ const on = n===name; document.body.classList.toggle("d-"+n, on);
    const b = $("dock").querySelector(`[data-d=${n}]`); if(b) b.classList.toggle("on", on); });
  if(name !== "wz"){ if(window.WZ && WZ.active()) WZ.stop(); Beta.verstecken(); }
  if(name){ toolsAuf(true); select(null); document.body.classList.remove("k-auf"); }
}
function toolsAuf(on){ document.body.classList.toggle("t-auf", on); $("toolsKnopf").setAttribute("aria-expanded", on); if(!on) setDock(null); }
$("toolsKnopf").onclick = ()=>toolsAuf(true);
$("dock").querySelector("[data-x=zu]").onclick = ()=>toolsAuf(false);
$("dock").querySelectorAll("button[data-d]").forEach(b=>b.onclick=()=>{ const n = document.body.classList.contains("d-"+b.dataset.d) ? null : b.dataset.d;
  if(n === "ansicht") $("ansicht").classList.remove("gewaehlt"); setDock(n); });
/* Aufnahmefenster: zeigt nur die Karte (ohne Leisten und Werkzeuge) und folgt allem, was hier passiert */
let aufnahme = null;
$("dock").querySelector("[data-aufnahme]").onclick = ()=>{
  if(aufnahme && !aufnahme.closed){ aufnahme.focus(); return; }
  aufnahme = window.open("aufnahme.html", "plyus-aufnahme", "popup,width=1280,height=720");
  toast(aufnahme ? "Aufnahmefenster offen – im Aufnahmeprogramm das Fenster „Plyus · Aufnahme“ wählen" : "Das Fenster wurde blockiert – bitte Pop-ups für diese Seite erlauben");
};
/* Ansicht: Vorschaubilder der Kartenarten (fertige Bilder, bild/ansicht); nach der Wahl Globus/Flach, 3D und bei Mix Hell/Dunkel als Symbole */
$("base").innerHTML = Object.entries(K.STYLES).map(([k,s])=>`<button data-b="${k}" class="${k==="sat"?"on":""}"><span class="an-bild"><img src="bild/ansicht/${k}.jpg?v=1" alt="" loading="lazy"></span>${s.name}</button>`).join("");
$("anJetzt").firstElementChild.src = "bild/ansicht/sat.jpg?v=1";
const dunkelMix = ()=>$("licht").classList.contains("dunkel");
$("base").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  const k = b.dataset.b; $("base").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); map.setBase(k);
  $("licht").hidden = k !== "mix"; document.body.classList.toggle("hell", k === "mix" ? !dunkelMix() : k !== "sat");
  $("anJetzt").firstElementChild.src = b.querySelector("img").src; $("ansicht").classList.add("gewaehlt"); });
$("anJetzt").onclick = ()=>$("ansicht").classList.remove("gewaehlt");
$("ansicht").querySelector("[data-x=zurueck]").onclick = ()=>setDock(null);
$("licht").onclick = function(){ const d = !dunkelMix(); this.classList.toggle("dunkel", d); const t = d ? "Hell" : "Dunkel"; this.title = t; this.setAttribute("aria-label", t);
  document.body.classList.toggle("hell", !d); map.setMixDunkel(d); };
$("drei").onclick = function(){ const on = !this.classList.contains("on"); this.classList.toggle("on", on); this.setAttribute("aria-pressed", on); map.set3D(on); };
function globusZeigen(an){ const v = $("view"), t = an ? "Zur flachen Karte" : "Zum Globus"; v.classList.toggle("flach", !an); v.title = t; v.setAttribute("aria-label", t); }
$("view").onclick = function(){ const an = this.classList.contains("flach"); globusZeigen(an); map.setGlobe(an); };

/* Ebenen ein- und ausblenden: Flächen und Lagedaten über die Karte, Pfeile/Formen und Symbole aus der eigenen Lagekarte hier */
const ebeneAus = new Set();
function ebenenLage(){
  const formenAus = ebeneAus.has("formen");
  K.DATA_LAYERS("lage").forEach(l=>{ if(map.getLayer(l)) map.setLayoutProperty(l, "visibility", formenAus ? "none" : "visible"); });
  markers.forEach(m=>{ m.getElement().style.display = ebeneAus.has("symbole") ? "none" : ""; });
}
$("ebenen").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{
  const k = b.dataset.e, an = ebeneAus.has(k); an ? ebeneAus.delete(k) : ebeneAus.add(k);
  b.classList.toggle("on", an); b.setAttribute("aria-pressed", an); map.setEbene(k, an); ebenenLage(); });
$("ebenen").querySelector("[data-x=zurueck]").onclick = ()=>setDock(null);

/* Lagedaten (Import): Liste und Auswahl-Ebenen nachziehen */
const fzHash = location.hash;
let chgDeep = /^#chg=(.+)$/.exec(location.hash);
function renderImp(){
  setTimeout(()=>{ renderList(); ensureChgLayers();
    if(chgDeep){ const cid = decodeURIComponent(chgDeep[1]); chgDeep = null; if(K.changes().some(f=>f.properties.cid===cid)) setTimeout(()=>chgSelect(cid, true), 300); } }, 0);
}
const startGlobe = !window.matchMedia("(max-width:720px)").matches;
globusZeigen(startGlobe);
let introDone = false;
const map = K.createMap({onImport: ()=>renderImp(), onNotice: t=>toast(t), globe:startGlobe, container:"map", style:"sat", onStyle: m=>{
  K.addDataLayers(m, "lage", K.toFeatures(visible())); ebenenLage();
  m.on("click","lage-hit", onHit); m.on("click","lage-area-fill", onHit);
  ["lage-hit","lage-area-fill"].forEach(l=>{ m.on("mouseenter",l,()=>m.getCanvas().style.cursor="pointer"); m.on("mouseleave",l,()=>m.getCanvas().style.cursor=""); });
  highlight();
  if(window.WZ) WZ.ensure(m);
  ensureChgLayers(m);
}});
/* Werkzeuge für alle: Lineal, Fläche, Radius, Koordinate */
map.on("click", ()=>{ if(document.body.classList.contains("d-ansicht")) setDock(null); });
map.on("click", e=>{
  if((window.WZ && WZ.active()) || !map.getLayer("imp-change-fill")) return;
  const h = map.queryRenderedFeatures(e.point, {layers:["imp-change-fill"]});
  if(h.length && h[0].properties.cid){ chgSelect(h[0].properties.cid); const it = $("list").querySelector(`[data-cid="${h[0].properties.cid}"]`); if(it && !mq.matches) it.scrollIntoView({block:"nearest"}); }
});
window.plyusMap = map;
/* Die Karte reicht unter die Adressleiste: Maßstab und „i“ an den sichtbaren unteren Rand heben, damit sie antippbar bleiben */
(function(){
  const vv = window.visualViewport;
  const leiste = ()=>{ const u = Math.max(0, Math.round(map.getContainer().clientHeight - (vv ? vv.height : innerHeight)));
    document.documentElement.style.setProperty("--unter-leiste", u + "px");
    map.setPadding({top:0, right:0, left:0, bottom:u});        // Kartenmitte = Mitte des sichtbaren Bereichs
  };
  leiste(); addEventListener("resize", leiste); if(vv) vv.addEventListener("resize", leiste);
})();
/* Aus der Fahrzeugliste: karte.html#fz=Name öffnet „Fahrzeug setzen“ mit diesem Fahrzeug */
setTimeout(()=>{ const m = /^#fz=(.+)$/.exec(fzHash); if(m && window.WZ && WZ.fahrzeug){ try{ setDock("wz"); }catch(e){} WZ.fahrzeug(decodeURIComponent(m[1])); } }, 600);
window.WZ = window.Werkzeuge ? Werkzeuge.init(map, {onStart: t=>{ select(null); document.body.classList.remove("k-auf");
  if(t === "sicht" || t === "fahrzeug") Beta.zeigen("werkzeug", "Dieses Werkzeug ist in Beta", {unten:74}); else Beta.verstecken(); }, onZurueck: ()=>setDock(null)}) : null;
const hideLoading = ()=>{ const rest = Math.max(0, 1400 - performance.now()); setTimeout(()=>{ $("loading").classList.add("done"); setTimeout(()=>{ $("loading").hidden = true; }, 900); }, rest); };

map.on("load", hideLoading); setTimeout(hideLoading, 8000);
let hitAt = 0;
function onHit(e){ if(window.WZ && WZ.active()) return; if(Date.now()-hitAt<50) return; hitAt = Date.now(); select(DATA.elemente.find(x=>x.id===e.features[0].properties.id)); }
map.on("click", e=>{
  if(window.WZ && WZ.active()) return;
  if(!map.getLayer("lage-hit")) return;
  if(!map.queryRenderedFeatures(e.point,{layers:["lage-hit","lage-area-fill"]}).length) select(null);
});
const fmtLL = (lat,lng)=>`${Math.abs(lat).toFixed(4)}° ${lat>=0?"N":"S"}  ${Math.abs(lng).toFixed(4)}° ${lng>=0?"O":"W"}`;

fetch("karte.json", {cache:"no-cache"}).then(r=>r.ok?r.json():K.emptyData()).catch(()=>K.emptyData()).then(d=>{
  DATA = d && d.elemente ? d : K.emptyData();
  render();
  const id = decodeURIComponent(location.hash.slice(1));
  const at = /^@(-?[\d.]+),(-?[\d.]+)(?:,([\d.]+))?$/.exec(id);
  if(at){ const go = ()=>map.jumpTo({center:[+at[1], +at[2]], zoom:+(at[3]||10)}); map.loaded() ? go() : map.once("load", go); }
  else if(id){ const el = DATA.elemente.find(x=>x.id===id); if(el){ const go = ()=>select(el, true); map.loaded() ? go() : map.once("load", go); } }
});

function visible(){ return DATA.elemente.filter(el=>active.has(groupOf(el))); }
function render(){
  let src = null; try{ src = map.getSource("lage"); }catch(e){}
  if(src) src.setData(K.toFeatures(visible()));
  markers.forEach(m=>m.remove());
  markers = visible().filter(el=>el.typ==="symbol").map(el=>{ const m = K.symbolMarker(map, el, {onClick:select}); m._id = el.id; return m; });
  ebenenLage(); renderList(); highlight();
  if(!introDone){ introDone = true; K.introRings(map, DATA.elemente); }
}
function icon(el){
  if(el.typ==="symbol") return `<span class="ic">${K.symbolSVG(el,18).svg}</span>`;
  return `<span class="ic"><i class="sw${el.typ==="flaeche"?" area":""}" style="background:${esc(K.farbe(el.farbe))}"></i></span>`;
}
function measure(el){
  if(el.typ==="linie"||el.typ==="pfeil") return Math.round(K.lineKm(el.koordinaten)).toLocaleString("de-DE")+" km";
  if(el.typ==="flaeche") return Math.round(K.areaKm2(el.koordinaten)).toLocaleString("de-DE")+" km²";
  return "";
}
const fmtDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d||""); return m ? `${m[3]}.${m[2]}.${m[1]}` : (d||""); };
/* ===== Leiste: Veränderungen der Front, nach Gruppen (Offensiven) ===== */
let chgSel = null;
const nfA = new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
const CCOL = {ru:"#d8344a", ua:"#2f7fe0", grau:"#c9c9c9"};
const dirLabel = x=>/richtung/i.test(x) ? x : x + "-Richtung";
function chgTitle(p){ return p.name || K.SEITE[p.richtung] || "Veränderung"; }
const LISTE_MAX = 8;
function renderList(){
  const d = K.importData(); if(d && K.ensureCids(d)) K.refreshImport(map);
  const all = K.changes(d).filter(f=>!f.properties.alt).sort((a,b)=>(b.properties.datum||"").localeCompare(a.properties.datum||""));
  const html = all.slice(0, LISTE_MAX).map(f=>{ const p = f.properties;
    const sub = [p.direktion ? dirLabel(p.direktion) : "", fmtDate(p.datum)].filter(Boolean).join(" · ");
    return `<button class="item chg${chgSel===p.cid?" sel":""}" data-cid="${esc(p.cid)}"><span class="ic"><i class="cq" style="background:${CCOL[p.richtung]||CCOL.grau}"></i></span><span><b>${esc(chgTitle(p))}</b><span class="c">${esc(sub)}</span></span><span class="km">${nfA.format(K.changeArea(f))} km²</span></button>`; }).join("");
  $("list").innerHTML = html ? html + '<a class="k-alle" href="gewinne.html">Alle Gewinne anzeigen</a>'
    : '<div class="empty">In diesem Stand gibt es noch keine eingetragenen Veränderungen.</div>';
  $("list").querySelectorAll(".item[data-cid]").forEach(b=>b.onclick=()=>chgSelect(b.dataset.cid, true, true));
  farbe(all[0]);
}
/* Pille: die dünne Leuchtlinie oben zeigt, wer zuletzt vorgerückt ist */
function farbe(f){ const r = f && f.properties.richtung;
  document.documentElement.style.setProperty("--glow", r === "ru" ? "255,70,90" : r === "ua" ? "70,150,255" : "255,255,255"); }
function ensureChgLayers(m){
  m = m || map;
  try{
    if(!m.getSource("imp")) return;
    if(!m.getLayer("chg-sel-fill")) m.addLayer({id:"chg-sel-fill", type:"fill", source:"imp", filter:["==",["get","cid"],"__none"], paint:{"fill-color":"#ffffff","fill-opacity":0.22}});
    if(!m.getLayer("chg-sel-line")) m.addLayer({id:"chg-sel-line", type:"line", source:"imp", filter:["==",["get","cid"],"__none"], paint:{"line-color":"#ffffff","line-width":2.5}});
    const f = ["==",["get","cid"], chgSel || "__none"]; m.setFilter("chg-sel-fill", f); m.setFilter("chg-sel-line", f);
  }catch(e){}
}
function chgSelect(cid, fly, ohneKarte){
  if(cid && sel) select(null);
  chgSel = cid || null; ensureChgLayers(); renderList();
  const card = $("card"), f = cid ? K.changes().find(x=>x.properties.cid===cid) : null;
  if(f && ohneKarte){ card.hidden = true; if(mq.matches) document.body.classList.remove("k-auf"); if(fly) flyChg(f); return; }
  try{ history.replaceState(null, "", f ? "#chg=" + encodeURIComponent(cid) : location.pathname + (location.hash.startsWith("#stand=") ? location.hash : "")); }catch(e){}
  if(!f){ if(!sel) card.hidden = true; return; }
  const p = f.properties, g = K.gruppen().find(x=>x.id===p.gruppe);
  card.innerHTML = `<div class="row"><h2>${esc(chgTitle(p))}</h2><button class="x" id="cx" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="stripe" style="background:${CCOL[p.richtung]||CCOL.grau}"></div>
    <div class="meta"><span>${esc(K.SEITE[p.richtung]||"")}</span><span>${nfA.format(K.changeArea(f))} km²</span>${p.datum?`<span>${esc(fmtDate(p.datum))}</span>`:""}</div>
    ${p.direktion||g ? `<div class="meta">${p.direktion?`<span>${esc(dirLabel(p.direktion))}</span>`:""}${g?`<span>${esc(g.name)}</span>`:""}</div>` : ""}
    <div class="acts"><button id="cLink">Link kopieren</button><button id="cZoom">Hinzoomen</button></div>`;
  card.hidden = false;
  $("cx").onclick = ()=>chgSelect(null);
  $("cZoom").onclick = ()=>flyChg(f);
  $("cLink").onclick = ()=>{ const url = location.href.split("#")[0] + "#chg=" + encodeURIComponent(cid);
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(()=>toast("Link kopiert"), ()=>prompt("Link:", url)); else prompt("Link:", url); };
  if(fly) flyChg(f);
}
/* Hinzoomen so, dass der Gewinn frei zwischen Tools oben und Pille/Liste unten liegt – auch am Handy */
function flyChg(f){
  const unten = document.body.classList.contains("k-auf") ? $("panel").offsetHeight + 100 : 90;
  const pad = mq.matches ? {top:80, bottom:unten, left:28, right:28} : {top:90, bottom:unten, left:90, right:90};
  try{ map.fitBounds(K.changeBounds(f), {padding:pad, maxZoom:12.5, duration:1100}); }catch(e){}
}
function highlight(){
  if(map.getLayer && map.getLayer("lage-sel")) map.setFilter("lage-sel",["==",["get","id"], sel && sel.typ!=="symbol" ? sel.id : "__none"]);
  markers.forEach(m=>m.getElement().classList.toggle("sel", !!sel && sel.id===m._id));
}
function center(el){
  const c = el.typ==="symbol" ? [el.koordinaten] : el.koordinaten;
  const lng = c.reduce((a,p)=>a+p[0],0)/c.length, lat = c.reduce((a,p)=>a+p[1],0)/c.length;
  return [lng, lat];
}
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(el._t); el._t=setTimeout(()=>el.hidden=true,2200); }
function select(el, fly){
  sel = el || null; highlight(); renderList();
  try{ history.replaceState(null, "", sel ? "#"+encodeURIComponent(sel.id) : location.pathname); }catch(e){}
  const card = $("card");
  if(!sel){ card.hidden = true; return; }
  const m = measure(sel), [lng,lat] = center(sel);
  const visual = sel.typ==="symbol" ? `<div class="big">${K.symbolSVG(sel,40).svg}</div>`
    : `<div class="stripe${sel.stil==="gestrichelt"?" dash":""}" style="background:${sel.stil==="gestrichelt"?`repeating-linear-gradient(90deg,${esc(K.farbe(sel.farbe))} 0 9px,transparent 9px 14px)`:esc(K.farbe(sel.farbe))}"></div>`;
  card.innerHTML = `<div class="row"><h2>${esc(sel.name||K.describe(sel))}</h2><button class="x" id="cx" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    ${visual}
    <div class="meta"><span>${esc(K.describe(sel))}</span>${m?`<span>${m}</span>`:""}${sel.datum?`<span>${esc(fmtDate(sel.datum))}</span>`:""}</div>
    ${sel.text?`<p>${esc(sel.text)}</p>`:""}
    ${K.medienHTML(sel)}
    <div class="coords">${fmtLL(lat,lng)}</div>
    <div class="acts"><button id="cLink">Link kopieren</button><button id="cZoom">Hinzoomen</button></div>`;
  card.hidden = false;
  $("cx").onclick = ()=>select(null);
  $("cZoom").onclick = ()=>select(sel, true);
  $("cLink").onclick = ()=>{
    const url = location.href.split("#")[0] + "#" + encodeURIComponent(sel.id);
    const ok = ()=>toast("Link kopiert");
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, ()=>prompt("Link:", url));
    else prompt("Link:", url);
  };
  if(fly){
    const c = sel.typ==="symbol" ? [sel.koordinaten] : sel.koordinaten;
    if(c.length===1) map.flyTo({center:c[0], zoom:Math.max(map.getZoom(),11), duration:1200});
    else map.fitBounds(c.reduce((b,p)=>b.extend(p), new maplibregl.LngLatBounds(c[0],c[0])), {padding:{top:120,bottom:mq.matches?120:80,left:mq.matches?40:380,right:mq.matches?40:400}, maxZoom:13, duration:1200});
  }
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && sel) select(null); });

/* ===== Verlauf: zwischen den Updates spulen ===== */
(function(){
  const TL = {list:[], i:-1, cache:{}, live:null, req:0, timer:0};
  const fmtDT = d=>new Date(d).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const fmtD = d=>new Date(d).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"});
  const nfx = new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
  function sumText(s){ if(!s || !s.n) return "keine Frontänderung";
    const p = []; if(s.ru) p.push("+" + nfx.format(s.ru) + " km² ru"); if(s.ua) p.push("+" + nfx.format(s.ua) + " km² ua"); if(s.grau) p.push(nfx.format(s.grau) + " km² Grauzone");
    return p.join(" · ") || s.n + " Änderungen"; }
  function load(st){ if(TL.cache[st.id]) return Promise.resolve(TL.cache[st.id]);
    return fetch(st.datei).then(r=>{ if(!r.ok) throw r.status; return r.json(); }).then(j=>TL.cache[st.id] = j); }
  function paint(){
    const n = TL.list.length, st = TL.list[TL.i], last = TL.i === n-1;
    $("tlRange").value = TL.i;
    [...$("tlTicks").children].forEach((t,k)=>{ t.classList.toggle("on", k===TL.i); t.classList.toggle("past", k<TL.i); });
    $("tlPrev").disabled = TL.i <= 0; $("tlNext").disabled = last;
    document.body.classList.toggle("tl-old", !last);
    $("tlLbl").innerHTML = last ? "Aktueller Stand" : 'Älterer Stand';
    $("tlInfo").innerHTML = `<b>${TL.i+1}/${n}</b> · ${fmtDT(st.datum)}${st.titel ? " · " + esc(st.titel) : ""} · ${sumText(st.sum)}`;
    $("tlInfo").title = $("tlInfo").textContent;
    setHash();
  }
  function setHash(){ const st = TL.list[TL.i]; try{ history.replaceState(null, "", TL.i === TL.list.length-1 ? location.pathname : "#stand=" + st.id); }catch(e){} }
  function apply(lage, karte, datum){
    K.setImportData(map, lage); renderImp(); K.setRefDate(map, datum);
    DATA = karte && karte.elemente ? karte : K.emptyData(); select(null); render(); setHash();
  }
  function go(i){
    i = Math.max(0, Math.min(TL.list.length-1, i)); if(i === TL.i && TL.live) return;
    if(!TL.live) TL.live = {lage: K.importData(), karte: DATA};
    TL.i = i; paint();
    const req = ++TL.req;
    if(i === TL.list.length-1){ apply(TL.live.lage, TL.live.karte, null); return; }
    load(TL.list[i]).then(s=>{ if(req === TL.req) apply(s.lage, s.karte, TL.list[i].datum); })
      .catch(()=>{ if(req === TL.req) toast("Dieser Stand konnte nicht geladen werden."); });
    if(TL.list[i+1] && i+1 < TL.list.length-1) load(TL.list[i+1]).catch(()=>{});   /* nächsten Stand vorladen */
  }
  function stopPlay(){ clearInterval(TL.timer); TL.timer = 0; $("tlPlay").classList.remove("on"); }
  $("tlPrev").onclick = ()=>{ stopPlay(); go(TL.i-1); };
  $("tlNext").onclick = ()=>{ stopPlay(); go(TL.i+1); };
  $("tlRange").addEventListener("input", e=>{ stopPlay(); go(+e.target.value); });
  $("tlPlay").onclick = ()=>{
    if(TL.timer){ stopPlay(); return; }
    if(TL.i >= TL.list.length-1) go(0);
    $("tlPlay").classList.add("on");
    TL.timer = setInterval(()=>{ if(TL.i >= TL.list.length-1) return stopPlay(); go(TL.i+1); }, 1800);
  };
  function build(){
    const n = TL.list.length, max = Math.max(1, ...TL.list.map(s=>s.sum ? s.sum.ru + s.sum.ua + s.sum.grau : 0));
    $("tlRange").max = n-1;
    $("tlTicks").innerHTML = TL.list.map((s,k)=>{ const a = s.sum ? s.sum.ru + s.sum.ua + s.sum.grau : 0;
      const h = a ? 10 + Math.round(18*Math.sqrt(a/max)) : 6, col = s.sum && s.sum.ua > s.sum.ru ? "#2f7fe0" : a ? "#d8344a" : "";
      return `<button class="tl-tick" data-k="${k}" title="${fmtDT(s.datum)}${s.titel ? " · " + esc(s.titel) : ""}" tabindex="-1"><i style="height:${h}px;${col ? "background:" + col : ""}"></i></button>`; }).join("");
    $("tlTicks").querySelectorAll(".tl-tick").forEach(b=>b.onclick=()=>{ stopPlay(); go(+b.dataset.k); });
    $("tlFirst").textContent = fmtD(TL.list[0].datum); $("tlLast").textContent = "Aktuell";
    $("tl").hidden = false; $("dock").querySelector("[data-d=tl]").hidden = false;
  }
  fetch("archiv/index.json", {cache:"no-cache"}).then(r=>r.ok ? r.json() : null).catch(()=>null).then(ix=>{
    if(!ix || !Array.isArray(ix.staende) || ix.staende.length < 2) return;
    TL.list = ix.staende.slice().sort((a,b)=>a.datum < b.datum ? -1 : 1); TL.i = TL.list.length-1;
    const m = /^#stand=(.+)$/.exec(location.hash);
    build(); paint();
    if(m){ const k = TL.list.findIndex(s=>s.id===decodeURIComponent(m[1]));
      if(k >= 0){ setDock("tl"); K.loadImport().then(()=>setTimeout(()=>go(k), 50)); } }
  });
})();

/* ===== Pille unten: klappt die neuesten Gewinne auf ===== */
(function(){
  const Pi = $("pille");
  const auf = on=>{ if(on) setDock(null); document.body.classList.toggle("k-auf", on); Pi.setAttribute("aria-expanded", on); };
  Pi.onclick = e=>{ e.stopPropagation(); auf(!document.body.classList.contains("k-auf")); };
  map.on("click", ()=>auf(false));
  document.addEventListener("keydown", e=>{ if(e.key === "Escape") auf(false); });
})();
</script>
</body>
