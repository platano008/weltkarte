<style>
.item.chg .ic{width:22px}
.card{right:calc(max(16px,env(safe-area-inset-right)) + 56px)!important}

.grp em{font-style:normal;margin-right:6px}
.grp em.ru{color:#ff6b7c}
.grp em.ua{color:#6aa8ff}
/* Menüs nur bei Bedarf: alles hängt an der Leiste oben rechts */
.dock{position:fixed;z-index:7;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));display:flex;flex-direction:column;background:rgba(14,15,17,.97);border:1px solid var(--line-2)}
.dock button{position:relative;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-top:1px solid var(--line);color:var(--muted);cursor:pointer;padding:0}

.dock button.on{background:var(--volt);color:var(--ink)}
.dock svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:square}
.dock .dot{position:absolute;right:7px;top:7px;width:7px;height:7px;background:#ffb800;display:none}
body.tl-old .dock .dot{display:block}
.switches{display:none!important;left:auto!important;right:calc(max(16px,env(safe-area-inset-right)) + 54px)!important;top:max(16px,env(safe-area-inset-top))!important;flex-direction:column!important;align-items:flex-end!important;gap:8px!important;justify-content:flex-start!important}
body.d-ansicht .switches{display:flex!important}
.maplibregl-ctrl-top-right{top:calc(max(16px,env(safe-area-inset-top)) + 134px)!important}
.wz-rail{display:none!important;flex-direction:row!important;top:calc(max(16px,env(safe-area-inset-top)) + 45px)!important;bottom:auto!important;right:calc(max(16px,env(safe-area-inset-right)) + 54px)!important}
.wz-rail button{border-top:0!important;border-left:1px solid var(--line)}
.wz-rail button:first-child{border-left:0}
.wz-rail .wz-clear{border-left:1px solid var(--line-2)!important}
body.d-wz .wz-rail{display:flex!important}
.wz-box{top:calc(max(16px,env(safe-area-inset-top)) + 100px)!important;bottom:auto!important;right:calc(max(16px,env(safe-area-inset-right)) + 54px)!important;left:auto!important;width:min(330px,calc(100vw - 90px))!important}
#tl{display:none}
body.d-tl #tl:not([hidden]){display:block}
@media (max-width:720px){
  .switches .seg button{padding:9px 11px}
  .wz-box{max-height:calc(100vh - var(--panel-h,0px) - 170px)!important;overflow:auto}
  .tl{right:12px!important}
  /* Handy: nur ein Pfeil; Tippen auf Logo/Kopf klappt die Liste auf */
  .hide-btn{display:none!important}
  .brand .toggle{margin-left:auto!important;border:0;width:40px;height:32px;margin-right:-8px;color:var(--fg)}
  .brand .toggle svg{width:18px;height:18px}
  .panel.closed .ph{cursor:pointer}
  /* Handy zugeklappt: nur das Logo unten in der Ecke; geöffnet geht die Liste weit hoch */
  body.m-closed .panel{transform:translateY(calc(100% + 8px));opacity:0;pointer-events:none;visibility:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),opacity .2s,visibility 0s .28s}
  body.m-closed .reopen{opacity:1;transform:none;pointer-events:auto;transition-delay:.1s}
  .panel:not(.closed){max-height:72%!important}
  body.m-closed .tl{bottom:calc(env(safe-area-inset-bottom) + 100px)!important}
}
/* Besucher-Leiste schlank: keine Filter-Chips, keine Lagedaten-Schalter, keine Legende */
#chips,#imp,#legend{display:none!important}
body.wz-on .nato{pointer-events:none}
@media (max-width:720px){
  .panel{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .panel .list{overflow:visible;min-height:auto}
  .panel .pf{display:none}
  .panel .grp{position:static}
}
/* Leiste ein-/ausblenden */
.hide-btn{display:grid;place-items:center;width:32px;height:32px;margin-left:auto;border:1px solid var(--line-2);background:none;color:var(--muted);cursor:pointer;padding:0;flex:none}
.hide-btn:hover{color:var(--fg);border-color:var(--fg)}
.hide-btn svg{width:16px;height:16px}
.brand .toggle{margin-left:6px}
.panel{transition:transform .28s cubic-bezier(.2,.7,.2,1),opacity .2s}
body.panel-gone .panel{transform:translateX(calc(-100% - 28px));opacity:0;pointer-events:none;visibility:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),opacity .2s,visibility 0s .28s}
.reopen{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;height:44px;padding:0 12px 0 14px;background:rgba(14,15,17,.97);border:1px solid var(--line-2);border-top:2px solid var(--volt);color:var(--fg);font-family:var(--display);font-size:19px;letter-spacing:.04em;cursor:pointer;opacity:0;transform:translateX(-12px);pointer-events:none;transition:opacity .2s,transform .2s}
.reopen svg{width:20px;height:20px;flex:none}
.reopen .chev{width:14px;height:14px;color:var(--muted)}
.reopen:hover .chev{color:var(--fg)}
body.panel-gone .reopen{opacity:1;transform:none;pointer-events:auto;transition-delay:.12s}
@media (max-width:720px){
  body.panel-gone .panel{transform:translateY(calc(100% + 8px))}
  .reopen{top:auto;bottom:calc(env(safe-area-inset-bottom) + 46px);transform:translateY(12px)}
  .reopen .chev{transform:rotate(-90deg)}
}
.home-link{color:inherit;text-decoration:none}
.home-link:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.panel{border-top:2px solid var(--volt)}
.search{position:relative}
.search input{width:100%;background:var(--bg);border:1px solid var(--line-2);padding:8px 10px 8px 32px;font-size:14px}
.search input:focus{border-color:var(--volt);outline:none}
.search svg{position:absolute;left:10px;top:50%;width:14px;height:14px;transform:translateY(-50%);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;display:block;border:1px solid rgba(0,0,0,.6)}
.grp{position:sticky;top:0;z-index:1;padding:8px 18px 6px;background:rgba(21,23,26,.98);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.pf{display:flex;justify-content:space-between;gap:12px;padding:8px 18px;border-top:1px solid var(--line-2);font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pf a{color:var(--muted);text-decoration:none}
.pf a:hover{color:var(--fg)}
.card{animation:cardIn .22s cubic-bezier(.2,.9,.25,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.card .big{display:flex;align-items:center;justify-content:center;min-height:76px;background:var(--surface-2);border:1px solid var(--line)}
.card .stripe{height:4px}
.card .stripe.dash{background-size:14px 4px!important}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px}
.card .acts button{font-size:13px;font-weight:600;padding:6px 10px;border:1px solid var(--line-2);color:var(--muted)}
.card .acts button:hover{color:var(--fg);border-color:var(--fg)}
.card .coords{font-family:var(--mono);font-size:11px;color:var(--muted)}
.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#000;transition:opacity .4s}
.loading.done{opacity:0;pointer-events:none}
.loading div{display:flex;flex-direction:column;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.loading b{display:block;width:140px;height:2px;background:var(--line-2);position:relative;overflow:hidden}
.loading b::after{content:"";position:absolute;inset:0;width:40%;background:var(--volt);animation:load 1s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (max-width:720px){ .pf .cur{display:none} .panel.closed .search,.panel.closed .legend,.panel.closed .pf{display:none} }
@media (prefers-reduced-motion:reduce){ .card{animation:none} .loading b::after{animation:none} }
.imp{display:flex;flex-direction:column;gap:6px}
.imp .eyebrow{display:flex;justify-content:space-between}
.chip i{width:10px;height:10px;display:inline-block;border:1px solid rgba(0,0,0,.5)}
</style>

<body>
<div id="map"></div>
<a class="mt-logo" id="mtLogo" href="https://www.maptiler.com" target="_blank" rel="noopener"><img src="https://api.maptiler.com/resources/logo.svg" alt="MapTiler logo"></a>
<div class="loading" id="loading"><div><span>Karte lädt</span><b></b></div></div>

<div class="dock" id="dock" role="toolbar" aria-label="Kartenmenüs">
  <button data-d="ansicht" title="Ansicht: Satellit, Karte, Gelände" aria-label="Ansicht"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg></button>
  <button data-d="wz" title="Werkzeuge: Lineal, Fläche, Radius, Koordinate" aria-label="Werkzeuge"><svg viewBox="0 0 24 24"><path d="M2.5 15.5L15.5 2.5l6 6-13 13z"/><path d="M6.5 11.5l2 2M9.5 8.5l2 2M12.5 5.5l2 2"/></svg></button>
  <button data-d="tl" title="Verlauf: zwischen Updates spulen" aria-label="Verlauf" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><i class="dot"></i></button>

<section class="panel" id="panel">
  <div class="ph">
    <div class="brand"><span class="eyebrow" id="stand">Lagekarte Ukraine</span><button class="hide-btn" id="hide" title="Leiste ausblenden" aria-label="Leiste ausblenden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M3 4h18v16H3zM9 4v16M17 9l-3 3 3 3"/></svg></button><button class="toggle" id="toggle" aria-label="Liste ein- oder ausklappen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><path d="M6 9l6 6 6-6"/></svg></button></div>
    <h1><a href="./" class="home-link" title="Zur Startseite">Plyus</a></h1>
    <div class="chips" id="chips"></div>
    <div class="imp" id="imp" hidden><div class="eyebrow"><span>Lagedaten</span><span id="impSrc"></span></div><div class="chips" id="impChips"></div></div>
    <div class="search" id="searchWrap" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM15 15l6 6"/></svg><input id="q" type="search" placeholder="Suchen …" autocomplete="off" aria-label="Einträge durchsuchen"></div>

</section>

<button class="reopen" id="reopen" title="Leiste einblenden" aria-label="Leiste einblenden"><svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M4.5 1.5H9.5V4H4.5Z M14.5 1.5H19.5V4H14.5Z M3.5 5H10.5V9.5H13.5V5H20.5L23 10V22.5H13.5V14H10.5V22.5H1V10Z M3.5 15.5V20H8V15.5Z M16 15.5V20H20.5V15.5Z"/></svg><span>Plyus</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><path d="M9 6l6 6-6 6"/></svg></button>
<div class="tl" id="tl" hidden>
  <div class="tl-top"><span class="eyebrow" id="tlLbl">Verlauf</span><span class="tl-info" id="tlInfo"></span></div>
  <div class="tl-row">
    <button class="tl-btn" id="tlPrev" aria-label="Vorheriges Update" title="Vorheriges Update"><svg viewBox="0 0 24 24"><path d="M17 4v16L6 12z"/><rect x="3" y="4" width="3" height="16"/></svg></button>
    <button class="tl-btn play" id="tlPlay" aria-label="Verlauf abspielen" title="Verlauf abspielen"><svg viewBox="0 0 24 24"><path d="M6 4v16l13-8z"/></svg></button>
    <div class="tl-track"><span class="tl-line"></span><div class="tl-ticks" id="tlTicks"></div><input class="tl-range" id="tlRange" type="range" min="0" max="1" step="1" value="1" aria-label="Stand wählen"></div>
    <button class="tl-btn" id="tlNext" aria-label="Nächstes Update" title="Nächstes Update"><svg viewBox="0 0 24 24"><path d="M7 4v16l11-8z"/><rect x="18" y="4" width="3" height="16"/></svg></button>
  </div>
  <div class="tl-ends"><span id="tlFirst"></span><span id="tlLast"></span></div>
</div>
<div class="card" id="card" hidden></div>
<div class="toast" id="toast" style="position:fixed;left:50%;bottom:calc(30px + var(--panel-h,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;box-shadow:inset 3px 0 0 var(--volt)" hidden></div>

<script>
const K = Karte, $ = id => document.getElementById(id), esc = K.esc;
const GROUPS = {symbol:"Symbole", linie:"Linien & Pfeile", flaeche:"Flächen"};
const CHIP = {symbol:"Symbole", linie:"Linien", flaeche:"Flächen"};
const groupOf = el => el.typ==="pfeil" ? "linie" : el.typ;
const active = new Set(Object.keys(GROUPS));
let DATA = K.emptyData(), sel = null, markers = [], query = "";
const mq = window.matchMedia("(max-width:720px)");
if(mq.matches) $("panel").classList.add("closed");

/* Menü-Leiste: immer nur ein Menü offen, damit nichts übereinander liegt */
function setDock(name){
  ["ansicht","wz","tl"].forEach(n=>{ const on = n===name; document.body.classList.toggle("d-"+n, on);
    const b = $("dock").querySelector(`[data-d=${n}]`); if(b) b.classList.toggle("on", on); });
  if(name !== "wz" && window.WZ && WZ.active()) WZ.stop();
  if(name) select(null);
}
$("dock").querySelectorAll("button").forEach(b=>b.onclick=()=>setDock(document.body.classList.contains("d-"+b.dataset.d) ? null : b.dataset.d));
/* switches */
$("base").innerHTML = Object.entries(K.STYLES).map(([k,s])=>`<button data-b="${k}" class="${k==="sat"?"on":""}">${s.name}</button>`).join("");
$("base").querySelectorAll("button").forEach(b=>b.onclick=()=>{ $("base").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); map.setBase(b.dataset.b); });
$("view").querySelectorAll("button").forEach(b=>b.onclick=()=>{ $("view").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); map.setGlobe(b.dataset.v==="globe"); });
$("legend").innerHTML = Object.values(K.SIDES).map(s=>`<span><i style="background:${s.color}"></i>${s.short}</span>`).join("") + `<span>- - - vermutet</span>`;

/* Lagedaten-Ebenen (Import) */
const impOff = new Set();
let chgDeep = /^#chg=(.+)$/.exec(location.hash);
function renderImp(d){
  setTimeout(()=>{ renderList(); ensureChgLayers();
    if(chgDeep){ const cid = decodeURIComponent(chgDeep[1]); chgDeep = null; if(K.changes().some(f=>f.properties.cid===cid)) setTimeout(()=>chgSelect(cid, true), 300); } }, 0);
  const meta = d && d.meta; if(!meta || !meta.ebenen || !meta.ebenen.length) return;
  const col = id=>{ if(id==="aenderungen") return "linear-gradient(135deg,#ff1f3d 50%,#1f8bff 50%)";
    const fs = d.features.filter(x=>x.properties.ebene===id); if(!fs.length) return "#888";
    const area = fs.find(x=>x.properties.art==="flaeche");
    if(area && fs.every(x=>x.properties.art!=="symbol")) return area.properties.fuellung;
    const sides = [...new Set(fs.filter(x=>x.properties.art==="symbol").map(x=>x.properties.sidc[1]))].map(k=>(K.SIDES[k]||K.SIDES.U).color);
    return sides.length > 1 ? `linear-gradient(135deg,${sides[0]} 50%,${sides[1]} 50%)` : sides[0]; };
  $("imp").hidden = false;
  $("impSrc").textContent = meta.quelle || "";
  $("impChips").innerHTML = meta.ebenen.map(l=>`<button class="chip${impOff.has(l.id)?"":" on"}" data-imp="${esc(l.id)}" aria-pressed="${!impOff.has(l.id)}"><i style="background:${esc(col(l.id))}"></i>${esc(l.name)}</button>`).join("");
  $("impChips").querySelectorAll("[data-imp]").forEach(b=>b.onclick=()=>{ const id=b.dataset.imp; impOff.has(id)?impOff.delete(id):impOff.add(id); map.setImportHidden([...impOff]); renderImp(d); });
}
const startGlobe = !window.matchMedia("(max-width:720px)").matches;
document.querySelector(`#view [data-v="${startGlobe?"globe":"flat"}"]`).classList.add("on");
const map = K.createMap({onImport: d=>renderImp(d), onNotice: t=>toast(t), globe:startGlobe, container:"map", style:"sat", onStyle: m=>{
  K.addDataLayers(m, "lage", K.toFeatures(visible()));
  m.on("click","lage-hit", onHit); m.on("click","lage-area-fill", onHit);
  ["lage-hit","lage-area-fill"].forEach(l=>{ m.on("mouseenter",l,()=>m.getCanvas().style.cursor="pointer"); m.on("mouseleave",l,()=>m.getCanvas().style.cursor=""); });
  highlight();
  if(window.WZ) WZ.ensure(m);
  ensureChgLayers(m);
}});
/* Werkzeuge für alle: Lineal, Fläche, Radius, Koordinate */
map.on("click", ()=>{ if(document.body.classList.contains("d-ansicht")) setDock(null); });
map.on("click", e=>{
  if((window.WZ && WZ.active()) || !map.getLayer("imp-change-fill")) return;
  const h = map.queryRenderedFeatures(e.point, {layers:["imp-change-fill"]});
  if(h.length && h[0].properties.cid){ chgSelect(h[0].properties.cid); const it = $("list").querySelector(`[data-cid="${h[0].properties.cid}"]`); if(it && !mq.matches) it.scrollIntoView({block:"nearest"}); }
});
window.WZ = window.Werkzeuge ? Werkzeuge.init(map, {onStart: ()=>{ select(null); if(mq.matches){ $("panel").classList.add("closed"); panelOffset(); } }}) : null;
const hideLoading = ()=>$("loading").classList.add("done");
map.on("load", hideLoading); setTimeout(hideLoading, 8000);
let hitAt = 0;
function onHit(e){ if(window.WZ && WZ.active()) return; if(Date.now()-hitAt<50) return; hitAt = Date.now(); select(DATA.elemente.find(x=>x.id===e.features[0].properties.id)); }
map.on("click", e=>{
  if(window.WZ && WZ.active()) return;
  if(!map.getLayer("lage-hit")) return;
  if(!map.queryRenderedFeatures(e.point,{layers:["lage-hit","lage-area-fill"]}).length) select(null);
});
const fmtLL = (lat,lng)=>`${Math.abs(lat).toFixed(4)}° ${lat>=0?"N":"S"}  ${Math.abs(lng).toFixed(4)}° ${lng>=0?"O":"W"}`;
let curLL = null; map.on("mousemove", e=>{ if(!curLL) requestAnimationFrame(()=>{ $("cur").textContent = fmtLL(curLL.lat, curLL.lng); curLL = null; }); curLL = e.lngLat; });

fetch("karte.json", {cache:"no-cache"}).then(r=>r.ok?r.json():K.emptyData()).catch(()=>K.emptyData()).then(d=>{
  DATA = d && d.elemente ? d : K.emptyData();
  if(DATA.aktualisiert) $("stand").textContent = "Lagekarte Ukraine · Stand " + new Date(DATA.aktualisiert).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  $("searchWrap").hidden = DATA.elemente.length < 6;
  render();
  const id = decodeURIComponent(location.hash.slice(1));
  const at = /^@(-?[\d.]+),(-?[\d.]+)(?:,([\d.]+))?$/.exec(id);
  if(at){ const go = ()=>map.jumpTo({center:[+at[1], +at[2]], zoom:+(at[3]||10)}); map.loaded() ? go() : map.once("load", go); }
  else if(id){ const el = DATA.elemente.find(x=>x.id===id); if(el){ const go = ()=>select(el, true); map.loaded() ? go() : map.once("load", go); } }
});

const matches = el => !query || ((el.name||"")+" "+(el.text||"")+" "+K.describe(el)+" "+(el.zusatz||"")).toLowerCase().includes(query);
function visible(){ return DATA.elemente.filter(el=>active.has(groupOf(el))); }
function render(){
  let src = null; try{ src = map.getSource("lage"); }catch(e){}
  if(src) src.setData(K.toFeatures(visible()));
  markers.forEach(m=>m.remove());
  markers = visible().filter(el=>el.typ==="symbol").map(el=>{ const m = K.symbolMarker(map, el, {onClick:select}); m._id = el.id; return m; });
  renderChips(); renderList(); highlight();
}
function renderChips(){
  const n = g => DATA.elemente.filter(el=>groupOf(el)===g).length;
  $("chips").innerHTML = Object.entries(CHIP).map(([k,v])=>`<button class="chip${active.has(k)?" on":""}" data-k="${k}" aria-pressed="${active.has(k)}">${v} <b>${n(k)}</b></button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; active.has(k)?active.delete(k):active.add(k); if(sel && !active.has(groupOf(sel))) select(null); render(); });
}
function icon(el){
  if(el.typ==="symbol") return `<span class="ic">${K.symbolSVG(el,18).svg}</span>`;
  return `<span class="ic"><i class="sw${el.typ==="flaeche"?" area":""}" style="background:${esc(K.farbe(el.farbe))}"></i></span>`;
}
function measure(el){
  if(el.typ==="linie"||el.typ==="pfeil") return Math.round(K.lineKm(el.koordinaten)).toLocaleString("de-DE")+" km";
  if(el.typ==="flaeche") return Math.round(K.areaKm2(el.koordinaten)).toLocaleString("de-DE")+" km²";
  return "";
}
const fmtDate = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d||""); return m ? `${m[3]}.${m[2]}.${m[1]}` : (d||""); };
/* ===== Leiste: Veränderungen der Front, nach Gruppen (Offensiven) ===== */
let chgSel = null;
const nfA = new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
const CCOL = {ru:"#d8344a", ua:"#2f7fe0", grau:"#c9c9c9"};
const dirLabel = x=>/richtung/i.test(x) ? x : x + "-Richtung";
function chgTitle(p){ return p.name || K.SEITE[p.richtung] || "Veränderung"; }
function chgMatch(f, gname){ if(!query) return true; const p = f.properties;
  return [p.name, p.direktion, gname, K.SEITE[p.richtung], fmtDate(p.datum)].some(v=>v && String(v).toLowerCase().includes(query)); }
function renderList(){
  const d = K.importData(); if(d && K.ensureCids(d)) K.refreshImport(map);
  const all = K.changes(d).slice().sort((a,b)=>(b.properties.datum||"").localeCompare(a.properties.datum||""));
  const groups = K.gruppen(d), gName = id=>{ const g = groups.find(x=>x.id===id); return g ? g.name : ""; };
  const shown = all.filter(f=>chgMatch(f, gName(f.properties.gruppe)));
  const secs = groups.map(g=>({name:g.name, items: shown.filter(f=>f.properties.gruppe===g.id)}));
  secs.push({name: groups.length ? "Weitere Veränderungen" : "Veränderungen", items: shown.filter(f=>!groups.some(g=>g.id===f.properties.gruppe))});
  let html = "";
  for(const sec of secs){ if(!sec.items.length) continue;
    const ru = sec.items.filter(f=>f.properties.richtung==="ru").reduce((t,f)=>t+K.changeArea(f),0), ua = sec.items.filter(f=>f.properties.richtung==="ua").reduce((t,f)=>t+K.changeArea(f),0);
    html += `<div class="grp"><span>${esc(sec.name)}</span><span>${ru?`<em class="ru">+${nfA.format(ru)}</em>`:""}${ua?`<em class="ua">+${nfA.format(ua)}</em>`:""}${ru||ua?" km²":""} · ${sec.items.length}</span></div>`;
    html += sec.items.map(f=>{ const p = f.properties;
      const sub = [p.direktion ? dirLabel(p.direktion) : "", fmtDate(p.datum)].filter(Boolean).join(" · ");
      return `<button class="item chg${chgSel===p.cid?" sel":""}" data-cid="${esc(p.cid)}"><span class="ic"><i class="cq" style="background:${CCOL[p.richtung]||CCOL.grau}"></i></span><span><b>${esc(chgTitle(p))}</b><span class="c">${esc(sub)}</span></span><span class="km">${nfA.format(K.changeArea(f))} km²</span></button>`; }).join("");
  }
  $("list").innerHTML = html || `<div class="empty">${!all.length ? "In diesem Stand gibt es noch keine eingetragenen Veränderungen." : "Nichts gefunden."}</div>`;
  $("list").querySelectorAll(".item[data-cid]").forEach(b=>b.onclick=()=>{ chgSelect(chgSel===b.dataset.cid ? null : b.dataset.cid, true); });
  $("count").textContent = `${all.length} Veränderung${all.length===1?"":"en"}`;
  $("searchWrap").hidden = all.length < 6;
}
function ensureChgLayers(m){
  m = m || map;
  try{
    if(!m.getSource("imp")) return;
    if(!m.getLayer("chg-sel-fill")) m.addLayer({id:"chg-sel-fill", type:"fill", source:"imp", filter:["==",["get","cid"],"__none"], paint:{"fill-color":"#ffffff","fill-opacity":0.22}});
    if(!m.getLayer("chg-sel-line")) m.addLayer({id:"chg-sel-line", type:"line", source:"imp", filter:["==",["get","cid"],"__none"], paint:{"line-color":"#ffffff","line-width":2.5}});
    const f = ["==",["get","cid"], chgSel || "__none"]; m.setFilter("chg-sel-fill", f); m.setFilter("chg-sel-line", f);
  }catch(e){}
}
function chgSelect(cid, fly){
  if(cid && sel) select(null);
  chgSel = cid || null; ensureChgLayers(); renderList();
  const card = $("card"), f = cid ? K.changes().find(x=>x.properties.cid===cid) : null;
  try{ history.replaceState(null, "", f ? "#chg=" + encodeURIComponent(cid) : location.pathname + (location.hash.startsWith("#stand=") ? location.hash : "")); }catch(e){}
  if(!f){ if(!sel) card.hidden = true; return; }
  const p = f.properties, g = K.gruppen().find(x=>x.id===p.gruppe);
  card.innerHTML = `<div class="row"><h2>${esc(chgTitle(p))}</h2><button class="x" id="cx" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="stripe" style="background:${CCOL[p.richtung]||CCOL.grau}"></div>
    <div class="meta"><span>${esc(K.SEITE[p.richtung]||"")}</span><span>${nfA.format(K.changeArea(f))} km²</span>${p.datum?`<span>${esc(fmtDate(p.datum))}</span>`:""}</div>
    ${p.direktion||g ? `<div class="meta">${p.direktion?`<span>${esc(dirLabel(p.direktion))}</span>`:""}${g?`<span>${esc(g.name)}</span>`:""}</div>` : ""}
    <div class="acts"><button id="cLink">Link kopieren</button><button id="cZoom">Hinzoomen</button></div>`;
  card.hidden = false;
  $("cx").onclick = ()=>chgSelect(null);
  $("cZoom").onclick = ()=>flyChg(f);
  $("cLink").onclick = ()=>{ const url = location.href.split("#")[0] + "#chg=" + encodeURIComponent(cid);
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(()=>toast("Link kopiert"), ()=>prompt("Link:", url)); else prompt("Link:", url); };
  if(fly) flyChg(f);
}
function flyChg(f){
  if(mq.matches){ $("panel").classList.add("closed"); panelOffset(); }
  const pad = mq.matches ? {top:200, bottom:110, left:40, right:70} : {top:80, bottom:80, left: document.body.classList.contains("panel-gone") ? 80 : 400, right:90};
  try{ map.fitBounds(K.changeBounds(f), {padding:pad, maxZoom:11.5, duration:900}); }catch(e){}
}
$("q").oninput = e=>{ query = e.target.value.trim().toLowerCase(); renderList(); };
function highlight(){
  if(map.getLayer && map.getLayer("lage-sel")) map.setFilter("lage-sel",["==",["get","id"], sel && sel.typ!=="symbol" ? sel.id : "__none"]);
  markers.forEach(m=>m.getElement().classList.toggle("sel", !!sel && sel.id===m._id));
}
function center(el){
  const c = el.typ==="symbol" ? [el.koordinaten] : el.koordinaten;
  const lng = c.reduce((a,p)=>a+p[0],0)/c.length, lat = c.reduce((a,p)=>a+p[1],0)/c.length;
  return [lng, lat];
}
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(el._t); el._t=setTimeout(()=>el.hidden=true,2200); }
function select(el, fly){
  sel = el || null; highlight(); renderList();
  try{ history.replaceState(null, "", sel ? "#"+encodeURIComponent(sel.id) : location.pathname); }catch(e){}
  const card = $("card");
  if(!sel){ card.hidden = true; return; }
  const m = measure(sel), [lng,lat] = center(sel);
  const visual = sel.typ==="symbol" ? `<div class="big">${K.symbolSVG(sel,40).svg}</div>`
    : `<div class="stripe${sel.stil==="gestrichelt"?" dash":""}" style="background:${sel.stil==="gestrichelt"?`repeating-linear-gradient(90deg,${esc(K.farbe(sel.farbe))} 0 9px,transparent 9px 14px)`:esc(K.farbe(sel.farbe))}"></div>`;
  card.innerHTML = `<div class="row"><h2>${esc(sel.name||K.describe(sel))}</h2><button class="x" id="cx" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    ${visual}
    <div class="meta"><span>${esc(K.describe(sel))}</span>${m?`<span>${m}</span>`:""}${sel.datum?`<span>${esc(fmtDate(sel.datum))}</span>`:""}</div>
    ${sel.text?`<p>${esc(sel.text)}</p>`:""}
    <div class="coords">${fmtLL(lat,lng)}</div>
    <div class="acts"><button id="cLink">Link kopieren</button><button id="cZoom">Hinzoomen</button></div>`;
  card.hidden = false;
  $("cx").onclick = ()=>select(null);
  $("cZoom").onclick = ()=>select(sel, true);
  $("cLink").onclick = ()=>{
    const url = location.href.split("#")[0] + "#" + encodeURIComponent(sel.id);
    const ok = ()=>toast("Link kopiert");
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, ()=>prompt("Link:", url));
    else prompt("Link:", url);
  };
  if(fly){
    const c = sel.typ==="symbol" ? [sel.koordinaten] : sel.koordinaten;
    if(c.length===1) map.flyTo({center:c[0], zoom:Math.max(map.getZoom(),11), duration:1200});
    else map.fitBounds(c.reduce((b,p)=>b.extend(p), new maplibregl.LngLatBounds(c[0],c[0])), {padding:{top:120,bottom:mq.matches?120:80,left:mq.matches?40:380,right:mq.matches?40:400}, maxZoom:13, duration:1200});
  }
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && sel) select(null); });

$("toggle").onclick = e=>{ e.stopPropagation(); $("panel").classList.toggle("closed"); panelOffset(); };
/* Handy: Tippen auf Logo oder Kopf öffnet die zugeklappte Liste */
$("panel").querySelector(".ph").addEventListener("click", e=>{
  if(!mq.matches || !$("panel").classList.contains("closed")) return;
  if(e.target.closest("input,#hide")) return;
  e.preventDefault(); $("panel").classList.remove("closed"); panelOffset();
});
/* Leiste ganz ausblenden (bleibt gemerkt) */
function setGone(on){ document.body.classList.toggle("panel-gone", on); try{ localStorage.setItem("plyus-leiste", on ? "aus" : "an"); }catch(e){} panelOffset(); }
$("hide").onclick = ()=>setGone(true);
$("reopen").onclick = ()=>{ if(mq.matches){ document.body.classList.remove("panel-gone"); $("panel").classList.remove("closed"); } else setGone(false); };
/* Handy: Zustand "zugeklappt" an den Body spiegeln, damit statt der Leiste nur das Logo erscheint */
function syncClosed(){ document.body.classList.toggle("m-closed", mq.matches && $("panel").classList.contains("closed")); panelOffset(); }
new MutationObserver(syncClosed).observe($("panel"), {attributes:true, attributeFilter:["class"]});
mq.addEventListener ? mq.addEventListener("change", syncClosed) : mq.addListener(syncClosed);
syncClosed();
try{ if(localStorage.getItem("plyus-leiste")==="aus" && !mq.matches) document.body.classList.add("panel-gone"); }catch(e){}
function panelOffset(){ document.documentElement.style.setProperty("--panel-h", mq.matches && !document.body.classList.contains("panel-gone") && !document.body.classList.contains("m-closed") ? $("panel").offsetHeight+"px" : "0px"); }
try{ new ResizeObserver(panelOffset).observe($("panel")); }catch(e){}
mq.addEventListener ? mq.addEventListener("change", panelOffset) : mq.addListener(panelOffset);
panelOffset();

/* ===== Verlauf: zwischen den Updates spulen ===== */
(function(){
  const TL = {list:[], i:-1, cache:{}, live:null, req:0, timer:0};
  const fmtDT = d=>new Date(d).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const fmtD = d=>new Date(d).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"});
  const nfx = new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
  const standText = $("stand").textContent;
  function sumText(s){ if(!s || !s.n) return "keine Frontänderung";
    const p = []; if(s.ru) p.push("+" + nfx.format(s.ru) + " km² ru"); if(s.ua) p.push("+" + nfx.format(s.ua) + " km² ua"); if(s.grau) p.push(nfx.format(s.grau) + " km² Grauzone");
    return p.join(" · ") || s.n + " Änderungen"; }
  function load(st){ if(TL.cache[st.id]) return Promise.resolve(TL.cache[st.id]);
    return fetch(st.datei).then(r=>{ if(!r.ok) throw r.status; return r.json(); }).then(j=>TL.cache[st.id] = j); }
  function paint(){
    const n = TL.list.length, st = TL.list[TL.i], last = TL.i === n-1;
    $("tlRange").value = TL.i;
    [...$("tlTicks").children].forEach((t,k)=>{ t.classList.toggle("on", k===TL.i); t.classList.toggle("past", k<TL.i); });
    $("tlPrev").disabled = TL.i <= 0; $("tlNext").disabled = last;
    document.body.classList.toggle("tl-old", !last);
    $("tlLbl").innerHTML = last ? "Aktueller Stand" : 'Älterer Stand';
    $("tlInfo").innerHTML = `<b>${TL.i+1}/${n}</b> · ${fmtDT(st.datum)}${st.titel ? " · " + esc(st.titel) : ""} · ${sumText(st.sum)}`;
    $("tlInfo").title = $("tlInfo").textContent;
    $("stand").textContent = last ? standText : "Lagekarte Ukraine · Stand " + new Date(st.datum).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
    setHash();
  }
  function setHash(){ const st = TL.list[TL.i]; try{ history.replaceState(null, "", TL.i === TL.list.length-1 ? location.pathname : "#stand=" + st.id); }catch(e){} }
  function apply(lage, karte, datum){
    K.setImportData(map, lage); renderImp(lage); K.setRefDate(map, datum);
    DATA = karte && karte.elemente ? karte : K.emptyData(); select(null); render(); setHash();
  }
  function go(i){
    i = Math.max(0, Math.min(TL.list.length-1, i)); if(i === TL.i && TL.live) return;
    if(!TL.live) TL.live = {lage: K.importData(), karte: DATA};
    TL.i = i; paint();
    const req = ++TL.req;
    if(i === TL.list.length-1){ apply(TL.live.lage, TL.live.karte, null); return; }
    load(TL.list[i]).then(s=>{ if(req === TL.req) apply(s.lage, s.karte, TL.list[i].datum); })
      .catch(()=>{ if(req === TL.req) toast("Dieser Stand konnte nicht geladen werden."); });
    if(TL.list[i+1] && i+1 < TL.list.length-1) load(TL.list[i+1]).catch(()=>{});   /* nächsten Stand vorladen */
  }
  function stopPlay(){ clearInterval(TL.timer); TL.timer = 0; $("tlPlay").classList.remove("on"); }
  $("tlPrev").onclick = ()=>{ stopPlay(); go(TL.i-1); };
  $("tlNext").onclick = ()=>{ stopPlay(); go(TL.i+1); };
  $("tlRange").addEventListener("input", e=>{ stopPlay(); go(+e.target.value); });
  $("tlPlay").onclick = ()=>{
    if(TL.timer){ stopPlay(); return; }
    if(TL.i >= TL.list.length-1) go(0);
    $("tlPlay").classList.add("on");
    TL.timer = setInterval(()=>{ if(TL.i >= TL.list.length-1) return stopPlay(); go(TL.i+1); }, 1800);
  };
  function build(){
    const n = TL.list.length, max = Math.max(1, ...TL.list.map(s=>s.sum ? s.sum.ru + s.sum.ua + s.sum.grau : 0));
    $("tlRange").max = n-1;
    $("tlTicks").innerHTML = TL.list.map((s,k)=>{ const a = s.sum ? s.sum.ru + s.sum.ua + s.sum.grau : 0;
      const h = a ? 10 + Math.round(18*Math.sqrt(a/max)) : 6, col = s.sum && s.sum.ua > s.sum.ru ? "#2f7fe0" : a ? "#d8344a" : "";
      return `<button class="tl-tick" data-k="${k}" title="${fmtDT(s.datum)}${s.titel ? " · " + esc(s.titel) : ""}" tabindex="-1"><i style="height:${h}px;${col ? "background:" + col : ""}"></i></button>`; }).join("");
    $("tlTicks").querySelectorAll(".tl-tick").forEach(b=>b.onclick=()=>{ stopPlay(); go(+b.dataset.k); });
    $("tlFirst").textContent = fmtD(TL.list[0].datum); $("tlLast").textContent = "Aktuell";
    $("tl").hidden = false; $("dock").querySelector("[data-d=tl]").hidden = false;
  }
  fetch("archiv/index.json", {cache:"no-cache"}).then(r=>r.ok ? r.json() : null).catch(()=>null).then(ix=>{
    if(!ix || !Array.isArray(ix.staende) || ix.staende.length < 2) return;
    TL.list = ix.staende.slice().sort((a,b)=>a.datum < b.datum ? -1 : 1); TL.i = TL.list.length-1;
    const m = /^#stand=(.+)$/.exec(location.hash);
    build(); paint();
    if(m){ const k = TL.list.findIndex(s=>s.id===decodeURIComponent(m[1]));
      if(k >= 0){ setDock("tl"); K.loadImport().then(()=>setTimeout(()=>go(k), 50)); } }
  });
})();
</script>
</body>
