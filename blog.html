<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Blog · Plyus</title>
<meta name="description" content="Berichte und Einordnungen zur Lage an der Front.">
<link rel="icon" type="image/png" href="bild/favicon.png?v=2">
<link rel="apple-touch-icon" href="bild/icon-180.png?v=2">
<link rel="stylesheet" href="style.css?v=202611171222">
<style>
html,body{height:auto;overflow:auto;overflow-x:hidden;background:#000}
.kopf{display:flex;justify-content:space-between;align-items:center;width:min(1100px,100%);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 0}
.kopf img{height:30px;width:auto;display:block}
.kopf nav a{margin-left:20px;color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.kopf nav a:hover{color:var(--fg)}
main{width:min(1100px,100%);margin:0 auto;padding:clamp(40px,8vw,90px) 16px 120px}
.gross{font-family:var(--korn);font-size:clamp(54px,12vw,150px);line-height:.9;margin:0 0 clamp(30px,6vw,70px)}
.eyebrow{display:block;margin-bottom:12px}
.posts{display:grid;gap:clamp(34px,6vw,70px)}
.post{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:clamp(16px,3vw,40px);align-items:center;color:inherit;text-decoration:none}
.post.ohne{grid-template-columns:1fr}
.post .b{aspect-ratio:16/10;background:#101010 center/cover no-repeat}
.post h2{font-family:var(--korn);font-size:clamp(26px,4.2vw,52px);line-height:1;margin:0 0 14px}
.post p{margin:0;color:#b9b9b9;font-size:16px;max-width:34em}
.post:hover h2{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.leer{color:var(--muted);font-size:17px}
article{width:min(760px,100%);margin:0 auto}
article h1{font-family:var(--korn);font-size:clamp(36px,7vw,84px);line-height:.96;margin:0 0 clamp(26px,5vw,50px)}
article h2{font-family:var(--korn);font-size:clamp(24px,3.6vw,38px);line-height:1.1;margin:1.7em 0 .5em}
article p{font-size:clamp(17px,1.5vw,19px);line-height:1.7;color:#dcdcdc;margin:0 0 1.1em;overflow-wrap:anywhere}
article figure{margin:2em calc(50% - min(50vw,470px));}
article figure img,article figure video,article figure iframe{display:block;width:100%;height:auto;background:#101010;border:0}
article figure iframe{aspect-ratio:16/9}
article figcaption{margin:10px 16px 0;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.zur{display:inline-block;margin-bottom:34px;color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.zur:hover{color:var(--fg)}
@media (max-width:640px){.post{grid-template-columns:1fr}}
.ascii{position:relative;margin:calc(-1*clamp(40px,8vw,90px)) calc(50% - 50vw) clamp(30px,6vw,70px);height:clamp(340px,62vh,640px);overflow:hidden}
.ascii canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ascii .ttl{position:absolute;left:max(16px,calc(50vw - 534px));bottom:clamp(20px,4vw,46px);z-index:2;pointer-events:none}
.ascii .gross{margin:0;text-shadow:0 0 40px #000,0 0 18px #000}
.ascii::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#000 0,transparent 18%,transparent 62%,#000 100%);pointer-events:none}
</style>
</head>
<body>
<header class="kopf"><a href="./" aria-label="Plyus"><img src="bild/logo.svg" alt=""></a><nav><a href="karte.html">Karte</a><a href="blog.html">Blog</a></nav></header>
<main id="main"><p class="leer">Lädt …</p></main>
<script>
const main = document.getElementById("main");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const datum = d => { const t = new Date(d); return isNaN(t) ? "" : t.toLocaleDateString("de-DE", {day:"2-digit", month:"long", year:"numeric"}); };
const sicher = u => /^(blog\/medien\/[\w.\-]+|https:\/\/[^\s"'<>]+)$/.test(u || "") ? u : "";
const youtube = u => { const m = /(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/.exec(u || ""); return m ? m[1] : null; };
const hole = async p => { const r = await fetch(p, {cache:"no-cache"}); if(!r.ok) throw 0; return r.json(); };


/* ASCII-Feld oben in der Blog-Übersicht: fließende Wolke aus Tastaturzeichen, reagiert auf Maus/Finger */
let asciiStop = null;
function asciiStart(){
  if(asciiStop){ asciiStop(); asciiStop = null; }
  const box = document.getElementById("ascii"); if(!box) return;
  const cv = box.querySelector("canvas"), cx = cv.getContext("2d");
  const RAMPE = " .·:-~+=*x%#&@", ROT = "+";
  const ZUF = "!?/\\|<>[]{}()$&%#@*+=-_:;.,'~^0123456789";
  let W, H, dpr, cw, ch, cols, rows, atlas, aw, start = performance.now(), maus = {x:-1e4, y:-1e4, t:0}, raf = 0, sicht = true;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function atlasBauen(){
    const z = RAMPE + ZUF; aw = Math.ceil(cw*dpr);
    atlas = document.createElement("canvas"); atlas.width = aw*z.length; atlas.height = Math.ceil(ch*dpr)*2;
    const a = atlas.getContext("2d"); a.textAlign = "center"; a.textBaseline = "middle";
    a.font = `${Math.round(ch*0.78*dpr)}px "Plyus Grotesk", ui-monospace, monospace`;
    for(let i = 0; i < z.length; i++){
      a.fillStyle = "#f4f4f4"; a.fillText(z[i], aw*i + aw/2, ch*dpr/2);
      a.fillStyle = "#e3262b"; a.fillText(z[i], aw*i + aw/2, ch*dpr*1.5);
    }
    atlas.map = z;
  }
  function groesse(){
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = box.clientWidth; H = box.clientHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ch = W < 640 ? 10 : 15; cw = ch*0.72; cols = Math.ceil(W/cw); rows = Math.ceil(H/ch); atlasBauen();
  }
  function feld(x, y, t){
    const u = x*0.055, v = y*0.09;
    let f = Math.sin(u + Math.sin(v*0.9 + t*0.55)*1.8 + t*0.35)
          + Math.sin(v*1.3 - t*0.42 + Math.sin(u*0.7 - t*0.3)*1.6)
          + 0.6*Math.sin((u + v)*0.8 + t*0.25 + Math.sin(u*0.35 + t*0.2)*2.2);
    return f/2.6*0.5 + 0.5;
  }
  function hash(i, j, k){ let h = (i*374761393 + j*668265263 + k*2147483647) | 0; h = (h ^ (h >>> 13))*1274126177; return ((h ^ (h >>> 16)) >>> 0)/4294967296; }
  function bild(now){
    const t = (now - start)/1000, ein = Math.min(1, t/1.6), bw = Math.ceil(ch*dpr), sw = cw*dpr, sh = ch*dpr;
    cx.clearRect(0, 0, cv.width, cv.height);
    const mx = maus.x/cw, my = maus.y/ch, mAlt = (now - maus.t)/1000, tick = Math.floor(t*12);
    for(let j = 0; j < rows; j++){
      const ny = j/rows;
      for(let i = 0; i < cols; i++){
        const nx = i/cols;
        let b = feld(i*cw/10.8, j*ch/9.4, t);
        b = Math.pow(b, 1.7);
        const rand = Math.min(1, nx*6, (1 - nx)*6);               // weich zum Rand
        b *= 0.35 + 0.65*rand;
        const dx = (i - mx)*cw/15, dy = (j - my)*ch/15, d = Math.sqrt(dx*dx + dy*dy);
        let welle = 0;
        if(d < 26){ welle = Math.max(0, 1 - d/26); b += welle*0.55*Math.max(0, 1 - mAlt*0.4) + Math.sin(d*0.7 - t*7)*0.12*welle; }
        const r = hash(i, j, 0);
        if(r > ein*1.02) continue;                                  // Einblenden: Zeichen tauchen nach und nach auf
        let idx, rot = false, a;
        const flack = hash(i, j, tick) < 0.004 + welle*0.05;         // vereinzelt Glitch-Zeichen
        if(flack && b > 0.12){ idx = RAMPE.length + Math.floor(hash(j, i, tick)*ZUF.length); a = 0.9; rot = hash(i, j, tick + 7) < 0.25; }
        else {
          const k = Math.min(RAMPE.length - 1, Math.floor(b*RAMPE.length)); if(k <= 0) continue;
          idx = k; a = 0.25 + Math.min(1, b)*0.75;
          if(b > 0.86 && r < 0.035) rot = true;
        }
        cx.globalAlpha = a;
        cx.drawImage(atlas, idx*aw, rot ? bw : 0, aw, bw, i*sw, j*sh, sw, sh);
      }
    }
    cx.globalAlpha = 1;
  }
  function lauf(now){ bild(now); raf = (sicht && !still) ? requestAnimationFrame(lauf) : 0; }
  const zeig = new IntersectionObserver(es=>{ sicht = es[0].isIntersecting; if(sicht && !raf && !still) raf = requestAnimationFrame(lauf); });
  zeig.observe(box);
  const bewegt = e => { const r = box.getBoundingClientRect(), p = e.touches ? e.touches[0] : e; maus = {x:p.clientX - r.left, y:p.clientY - r.top, t:performance.now()}; };
  box.addEventListener("pointermove", bewegt); box.addEventListener("touchstart", bewegt, {passive:true});
  box.addEventListener("pointerleave", ()=>{ maus.x = -1e4; });
  const rs = ()=>{ groesse(); if(still) bild(start + 4000); };
  window.addEventListener("resize", rs);
  (document.fonts ? document.fonts.load('15px "Plyus Grotesk"') : Promise.resolve()).then(()=>{ groesse(); if(still) bild(start + 4000); else raf = requestAnimationFrame(lauf); });
  asciiStop = ()=>{ cancelAnimationFrame(raf); zeig.disconnect(); window.removeEventListener("resize", rs); };
}

async function liste(){
  document.title = "Blog · Plyus";
  try{
    const d = await hole("blog/index.json"), L = d.beitraege || [];
    main.innerHTML = '<div class="ascii" id="ascii"><canvas></canvas><div class="ttl"><span class="eyebrow">Berichte</span><h1 class="gross">Blog</h1></div></div>' + (L.length ? '<div class="posts">' + L.map(b=>{ const bild = sicher(b.bild);
      return '<a class="post' + (bild ? "" : " ohne") + '" href="#' + encodeURIComponent(b.id) + '">' + (bild ? '<div class="b" style="background-image:url(&quot;' + esc(bild) + '&quot;)"></div>' : "") + '<div><span class="eyebrow">' + esc(datum(b.datum)) + '</span><h2>' + esc(b.titel) + '</h2><p>' + esc(b.kurz || "") + '</p></div></a>'; }).join("") + '</div>' : '<p class="leer">Noch keine Beiträge.</p>');
  }catch(e){ main.innerHTML = '<div class="ascii" id="ascii"><canvas></canvas><div class="ttl"><h1 class="gross">Blog</h1></div></div><p class="leer">Die Beiträge konnten nicht geladen werden.</p>'; }
  asciiStart();
}
async function beitrag(id){
  if(!/^[\w-]+$/.test(id)) return liste();
  try{
    const b = await hole("blog/b/" + id + ".json"); if(b.status !== "veroeffentlicht") throw 0;
    document.title = b.titel + " · Plyus";
    main.innerHTML = '<article><a class="zur" href="blog.html">← Alle Beiträge</a><span class="eyebrow">' + esc(datum(b.datum)) + '</span><h1>' + esc(b.titel) + '</h1>' + (b.bloecke || []).map(x=>{
      if(x.t === "h") return "<h2>" + esc(x.x) + "</h2>";
      if(x.t === "p") return String(x.x || "").split(/\n\s*\n/).map(a=>"<p>" + esc(a.trim()).replace(/\n/g, "<br>") + "</p>").join("");
      const src = sicher(x.src), cap = x.cap ? "<figcaption>" + esc(x.cap) + "</figcaption>" : ""; if(!src) return "";
      if(x.t === "img") return '<figure><img src="' + esc(src) + '" alt="' + esc(x.cap || "") + '" loading="lazy">' + cap + "</figure>";
      if(x.t === "vid"){ const y = youtube(src); return "<figure>" + (y ? '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(y) + '" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="Video"></iframe>' : '<video src="' + esc(src) + '" controls playsinline preload="metadata"></video>') + cap + "</figure>"; }
      return ""; }).join("") + "</article>";
    scrollTo(0, 0);
  }catch(e){ main.innerHTML = '<article><a class="zur" href="blog.html">← Alle Beiträge</a><p class="leer">Diesen Beitrag gibt es nicht (mehr).</p></article>'; }
}
function route(){ if(asciiStop){ asciiStop(); asciiStop = null; } const id = decodeURIComponent(location.hash.slice(1)); id ? beitrag(id) : liste(); }
addEventListener("hashchange", route); route();
</script>
</body>
</html>
