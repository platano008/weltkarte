<script>
const main = document.getElementById("main");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const datum = d => { const t = new Date(d); return isNaN(t) ? "" : t.toLocaleDateString("de-DE", {day:"2-digit", month:"long", year:"numeric"}); };
const sicher = u => /^(blog\/medien\/[\w.\-]+|https:\/\/[^\s"'<>]+)$/.test(u || "") ? u : "";
const youtube = u => { const m = /(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/.exec(u || ""); return m ? m[1] : null; };
const hole = async p => { const r = await fetch(p, {cache:"no-cache"}); if(!r.ok) throw 0; return r.json(); };


/* ASCII-Feld oben in der Blog-Übersicht: fließende Wolke aus Tastaturzeichen, reagiert auf Maus/Finger */
let asciiStop = null;
function asciiStart(){
  if(asciiStop){ asciiStop(); asciiStop = null; }
  const box = document.getElementById("ascii"); if(!box) return;
  const cv = box.querySelector("canvas"), cx = cv.getContext("2d");
  const RAMPE = " .·:-~+=*x%#&@", ROT = "+";
  const ZUF = "!?/\\|<>[]{}()$&%#@*+=-_:;.,'~^0123456789", KANTE = "-|/\\";
  let W, H, dpr, cw, ch, cols, rows, atlas, aw, start = performance.now(), raf = 0, sicht = true, letzt = 0;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function atlasBauen(){
    const z = RAMPE + ZUF + KANTE; aw = Math.ceil(cw*dpr);
    atlas = document.createElement("canvas"); atlas.width = aw*z.length; atlas.height = Math.ceil(ch*dpr)*3;
    const a = atlas.getContext("2d"); a.textAlign = "center"; a.textBaseline = "middle";
    a.font = `${Math.round(ch*0.78*dpr)}px "Plyus Grotesk", ui-monospace, monospace`;
    for(let i = 0; i < z.length; i++){
      a.fillStyle = "#f4f4f4"; a.fillText(z[i], aw*i + aw/2, ch*dpr/2);
      a.fillStyle = "#ff2a45"; a.fillText(z[i], aw*i + aw/2, ch*dpr*1.5);
      a.fillStyle = "#3a96ff"; a.fillText(z[i], aw*i + aw/2, ch*dpr*2.5);
    }
    atlas.map = z;
  }
  function groesse(){
    dpr = Math.min(window.devicePixelRatio || 1, matchMedia("(pointer:coarse)").matches ? 1.5 : 2); W = box.clientWidth; H = box.clientHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ch = W < 640 ? 10 : 15; cw = ch*0.72; cols = Math.ceil(W/cw); rows = Math.ceil(H/ch); atlasBauen();
    mk.width = cols; mk.height = rows;
    if(!drohnen.length) drohnenStart();
  }
  /* ---------- Drohnen: werden in eine kleine Maske gezeichnet (1 Pixel = 1 Zeichen) ----------
     Rot-Kanal = Rumpf (helle Zeichen), Grün = rote Akzente, Blau = Schatten am Boden */
  const mk = document.createElement("canvas"), mx2 = mk.getContext("2d", {willReadFrequently: true});
  const drohnen = []; window.__drohnen = drohnen;
  const zufall = (a, b)=>a + Math.random()*(b - a);
  function neu(d, erst){
    const gr = Math.min(W, H*1.15)*0.8;
    const groesse = {quad: 0.26, shahed: 0.24, aufkl: 0.34, lancet: 0.2, jet: 0.3}[d.typ]*gr*(W < 640 ? 1.25 : 1);
    const seite = Math.random() < 0.5 ? -1 : 1;
    d.s = groesse*zufall(0.85, 1.1);
    d.x = seite < 0 ? -d.s : W + d.s; d.y = zufall(H*0.18, H*0.7);
    if(erst){ d.x = zufall(W*0.15, W*0.85); }
    d.kurs = seite < 0 ? zufall(-0.25, 0.25) : Math.PI + zufall(-0.25, 0.25);
    d.v = {quad: 38, shahed: 120, aufkl: 70, lancet: 95, jet: 165}[d.typ]*zufall(0.85, 1.15)*(W < 640 ? 0.7 : 1);
    d.ph = Math.random()*10; d.spur = []; d.weg = 0;
    if(!erst){                                                                 // neue Drohne: freie Höhe suchen, abwechselnd rot/blau
      d.team = d.team === "ru" ? "ua" : "ru";
      let best = d.y, bAb = -1;
      for(let k = 0; k < 8; k++){ const y = zufall(H*0.15, H*0.75); const ab = Math.min(...drohnen.filter(e=>e !== d && !e.weg).map(e=>Math.abs(e.y - y)), 1e9); if(ab > bAb){ bAb = ab; best = y; } }
      d.y = best;
    }

      sp.dataset.f = f; sp.textContent = sp.dataset.o || zuf(); sp.style.opacity = (1 - f*0.8).toFixed(2); spans.push(sp); });
    mess.remove();
  });
  if(!spans.length || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  flimmerIv = setInterval(()=>{ if(document.hidden) return; for(const sp of spans){ const f = +sp.dataset.f, o = sp.dataset.o; sp.textContent = (!o || Math.random() < f*f*0.95) ? zuf() : o; } }, 110);
}
async function liste(){
  document.title = "Blog · Plyus";
  try{
    const d = await hole("blog/index.json"), L = d.beitraege || [];
    main.innerHTML = '<div class="ascii" id="ascii"><div class="cv"><canvas></canvas></div><div class="ttl"><span class="eyebrow">Berichte</span><h1 class="gross">Blog</h1></div></div>' + (L.length ? '<div class="posts">' + L.map(b=>{ const bild = sicher(b.cover || b.bild);
      return '<a class="post' + (bild ? "" : " ohne") + '" href="#' + encodeURIComponent(b.id) + '">' + (bild ? '<div class="b" style="background-image:url(&quot;' + esc(bild) + '&quot;)"></div>' : "") + '<div><span class="eyebrow">' + esc(datum(b.datum)) + '</span><h2>' + esc(b.titel) + '</h2><p class="flimmer" data-t="' + esc(ohneMarkup(b.kurz || "")) + '"></p></div></a>'; }).join("") + '</div>' : '<p class="leer">Noch keine Beiträge.</p>');
  }catch(e){ main.innerHTML = '<div class="ascii" id="ascii"><div class="cv"><canvas></canvas></div><div class="ttl"><h1 class="gross">Blog</h1></div></div><p class="leer">Die Beiträge konnten nicht geladen werden.</p>'; }
  asciiStart(); flimmern();
}
async function beitrag(id){
  if(!/^[\w-]+$/.test(id)) return liste();
  try{
    const b = await hole("blog/b/" + id + ".json"); if(b.status !== "veroeffentlicht") throw 0;
    document.title = b.titel + " · Plyus";
    main.innerHTML = '<article><a class="zur" href="blog.html">← Alle Beiträge</a><span class="eyebrow">' + esc(datum(b.datum)) + '</span><h1>' + esc(b.titel) + '</h1>' + (sicher(b.cover) ? '<figure class="cover"><img src="' + esc(sicher(b.cover)) + '" alt=""></figure>' : '') + (b.bloecke || []).map(x=>{
      if(x.t === "h") return "<h2>" + fmt(x.x) + "</h2>";
      if(x.t === "p") return String(x.x || "").split(/\n\s*\n/).map(a=>"<p>" + fmt(a.trim()).replace(/\n/g, "<br>") + "</p>").join("");
      const src = sicher(x.src), cap = x.cap ? "<figcaption>" + esc(x.cap) + "</figcaption>" : ""; if(!src) return "";
      if(x.t === "img") return '<figure><img src="' + esc(src) + '" alt="' + esc(x.cap || "") + '" loading="lazy">' + cap + "</figure>";
      if(x.t === "vid"){ const y = youtube(src); return "<figure>" + (y ? '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(y) + '" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="Video"></iframe>' : '<video src="' + esc(src) + '" controls playsinline preload="metadata"></video>') + cap + "</figure>"; }
      return ""; }).join("") + "</article>";
    scrollTo(0, 0);
  }catch(e){ main.innerHTML = '<article><a class="zur" href="blog.html">← Alle Beiträge</a><p class="leer">Diesen Beitrag gibt es nicht (mehr).</p></article>'; }
}
function route(){ clearInterval(flimmerIv); if(asciiStop){ asciiStop(); asciiStop = null; } const id = decodeURIComponent(location.hash.slice(1)); id ? beitrag(id) : liste(); }
addEventListener("hashchange", route); route();

  bt.onclick = ()=>auf(true); document.getElementById("menuX").onclick = ()=>auf(false);
  m.querySelectorAll("a").forEach(a=>a.addEventListener("click", ()=>auf(false)));
