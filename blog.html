<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Blog · Plyus</title>
<meta name="description" content="Berichte und Einordnungen zur Lage an der Front.">
<link rel="icon" type="image/png" href="bild/favicon.png?v=2">
<link rel="apple-touch-icon" href="bild/icon-180.png?v=2">
<link rel="stylesheet" href="style.css?v=202611161854">
<style>
html,body{height:auto;overflow:auto;overflow-x:hidden;background:#000}
.kopf{display:flex;justify-content:space-between;align-items:center;width:min(1100px,100%);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 0}
.kopf img{height:30px;width:auto;display:block}
.kopf nav a{margin-left:20px;color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.kopf nav a:hover{color:var(--fg)}
main{width:min(1100px,100%);margin:0 auto;padding:clamp(40px,8vw,90px) 16px 120px}
.gross{font-family:var(--korn);font-size:clamp(54px,12vw,150px);line-height:.9;margin:0 0 clamp(30px,6vw,70px)}
.eyebrow{display:block;margin-bottom:12px}
.posts{display:grid;gap:clamp(34px,6vw,70px)}
.post{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:clamp(16px,3vw,40px);align-items:center;color:inherit;text-decoration:none}
.post.ohne{grid-template-columns:1fr}
.post .b{aspect-ratio:16/10;background:#101010 center/cover no-repeat}
.post h2{font-family:var(--korn);font-size:clamp(26px,4.2vw,52px);line-height:1;margin:0 0 14px}
.post p{margin:0;color:#b9b9b9;font-size:16px;max-width:34em}
.post:hover h2{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.leer{color:var(--muted);font-size:17px}
article{width:min(760px,100%);margin:0 auto}
article h1{font-family:var(--korn);font-size:clamp(36px,7vw,84px);line-height:.96;margin:0 0 clamp(26px,5vw,50px)}
article h2{font-family:var(--korn);font-size:clamp(24px,3.6vw,38px);line-height:1.1;margin:1.7em 0 .5em}
article p{font-size:clamp(17px,1.5vw,19px);line-height:1.7;color:#dcdcdc;margin:0 0 1.1em;overflow-wrap:anywhere}
article figure{margin:2em calc(50% - min(50vw,470px));}
article figure img,article figure video,article figure iframe{display:block;width:100%;height:auto;background:#101010;border:0}
article figure iframe{aspect-ratio:16/9}
article figcaption{margin:10px 16px 0;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.zur{display:inline-block;margin-bottom:34px;color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.zur:hover{color:var(--fg)}
@media (max-width:640px){.post{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="kopf"><a href="./" aria-label="Plyus"><img src="bild/logo.svg" alt=""></a><nav><a href="karte.html">Karte</a><a href="blog.html">Blog</a></nav></header>
<main id="main"><p class="leer">Lädt …</p></main>
<script>
const main = document.getElementById("main");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const datum = d => { const t = new Date(d); return isNaN(t) ? "" : t.toLocaleDateString("de-DE", {day:"2-digit", month:"long", year:"numeric"}); };
const sicher = u => /^(blog\/medien\/[\w.\-]+|https:\/\/[^\s"'<>]+)$/.test(u || "") ? u : "";
const youtube = u => { const m = /(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/.exec(u || ""); return m ? m[1] : null; };
const hole = async p => { const r = await fetch(p, {cache:"no-cache"}); if(!r.ok) throw 0; return r.json(); };

async function liste(){
  document.title = "Blog · Plyus";
  try{
    const d = await hole("blog/index.json"), L = d.beitraege || [];
    main.innerHTML = '<span class="eyebrow">Berichte</span><h1 class="gross">Blog</h1>' + (L.length ? '<div class="posts">' + L.map(b=>{ const bild = sicher(b.bild);
      return '<a class="post' + (bild ? "" : " ohne") + '" href="#' + encodeURIComponent(b.id) + '">' + (bild ? '<div class="b" style="background-image:url(&quot;' + esc(bild) + '&quot;)"></div>' : "") + '<div><span class="eyebrow">' + esc(datum(b.datum)) + '</span><h2>' + esc(b.titel) + '</h2><p>' + esc(b.kurz || "") + '</p></div></a>'; }).join("") + '</div>' : '<p class="leer">Noch keine Beiträge.</p>');
  }catch(e){ main.innerHTML = '<h1 class="gross">Blog</h1><p class="leer">Die Beiträge konnten nicht geladen werden.</p>'; }
}
async function beitrag(id){
  if(!/^[\w-]+$/.test(id)) return liste();
  try{
    const b = await hole("blog/b/" + id + ".json"); if(b.status !== "veroeffentlicht") throw 0;
    document.title = b.titel + " · Plyus";
    main.innerHTML = '<article><a class="zur" href="blog.html">← Alle Beiträge</a><span class="eyebrow">' + esc(datum(b.datum)) + '</span><h1>' + esc(b.titel) + '</h1>' + (b.bloecke || []).map(x=>{
      if(x.t === "h") return "<h2>" + esc(x.x) + "</h2>";
      if(x.t === "p") return String(x.x || "").split(/\n\s*\n/).map(a=>"<p>" + esc(a.trim()).replace(/\n/g, "<br>") + "</p>").join("");
      const src = sicher(x.src), cap = x.cap ? "<figcaption>" + esc(x.cap) + "</figcaption>" : ""; if(!src) return "";
      if(x.t === "img") return '<figure><img src="' + esc(src) + '" alt="' + esc(x.cap || "") + '" loading="lazy">' + cap + "</figure>";
      if(x.t === "vid"){ const y = youtube(src); return "<figure>" + (y ? '<iframe src="https://www.youtube-nocookie.com/embed/' + esc(y) + '" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="Video"></iframe>' : '<video src="' + esc(src) + '" controls playsinline preload="metadata"></video>') + cap + "</figure>"; }
      return ""; }).join("") + "</article>";
    scrollTo(0, 0);
  }catch(e){ main.innerHTML = '<article><a class="zur" href="blog.html">← Alle Beiträge</a><p class="leer">Diesen Beitrag gibt es nicht (mehr).</p></article>'; }
}
function route(){ const id = decodeURIComponent(location.hash.slice(1)); id ? beitrag(id) : liste(); }
addEventListener("hashchange", route); route();
</script>
</body>
</html>
