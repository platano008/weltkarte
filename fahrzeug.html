<style>
.fzs-zurueck{display:inline-flex;margin:0 0 22px;color:#cfcfcf;text-decoration:none;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.fzs-zurueck:hover{color:#fff}
.fzs{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.fzs-box{border:1px solid rgba(255,255,255,.13);border-radius:20px!important;background:linear-gradient(180deg,#0c0c0c,#050505);padding:20px;display:flex;flex-direction:column;gap:14px}
.fzs-foto{margin:0;border-radius:14px!important;overflow:hidden;background:#0b0c0e;border:1px solid rgba(255,255,255,.08)}
.fzs-foto img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.fzs-foto figcaption{padding:10px 14px 12px;font-size:12.5px;line-height:1.5;color:#9a9a9a}
.fzs-foto figcaption a{color:#cfe6ff}
.fzs-foto .leer{aspect-ratio:3/2;display:grid;place-items:center;color:#777;font-size:13px;padding:20px;text-align:center}
.fzs-bild{padding:10px 6px 0;border-radius:14px!important;background:radial-gradient(110% 90% at 50% 100%,rgba(255,255,255,.07),transparent 70%),#08090b}
.fzs-bild svg{display:block;width:100%;height:auto}
.pk{display:inline-block;width:9px;height:9px;border-radius:50%!important}
.fz-seite{display:flex;gap:5px}
.fz-seite span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:3px 7px;border-radius:999px!important;border:1px solid}
.fz-seite .ua{color:#8cc6ff;border-color:rgba(74,163,255,.5)}.fz-seite .ru{color:#ff8a99;border-color:rgba(255,53,80,.5)}
.fz-mod{display:flex;gap:6px;flex-wrap:wrap}
.fz-mod button{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 11px;border:1px solid rgba(255,255,255,.18);border-radius:999px!important;background:none;color:#b8b8b8;font:inherit;font-size:12px;cursor:pointer}
.fz-mod button:hover{border-color:rgba(255,255,255,.5)}
.fz-mod button.on{background:#fff;color:#000;border-color:#fff}
.fz-modinfo{margin:0;font-size:13.5px;line-height:1.5;color:#a9a9a9}
.fz-modinfo b{color:#fff;font-weight:600}
.fzs-werte{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.09);border-radius:14px!important;overflow:hidden}
.fzs-werte div{background:#0a0b0d;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.fzs-werte span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#7a7a7a}
.fzs-werte b{font-size:16px;font-weight:600;color:#f0f0f0;overflow-wrap:anywhere}
.fzs h2{margin:4px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a8a8a;font-weight:500}
.fzs-waffen{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fzs-waffen li{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:10px!important;background:#0a0b0d;border:1px solid rgba(255,255,255,.07);font-size:14px}
.fzs-waffen li b{font-weight:600;white-space:nowrap}
.fzs-waffen li.haupt{border-color:rgba(255,255,255,.22)}
.fzs dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;line-height:1.5}
.fzs dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7a7a7a;padding-top:3px}
.fzs dd{margin:0;color:#dcdcdc}
.fz-geber{display:flex;flex-wrap:wrap;gap:5px}
.fz-geber span{font-size:12.5px;padding:2px 9px;border-radius:999px!important;background:rgba(74,163,255,.12);color:#b9dbff}
.fzs-knoepfe{display:flex;flex-wrap:wrap;gap:8px}
.fzs-knoepfe a{padding:11px 16px;border:1px solid rgba(255,255,255,.3);border-radius:999px!important;color:#fff;text-decoration:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.fzs-knoepfe a:first-child{background:#fff;color:#000;border-color:#fff}
.fzs-knoepfe a:hover{border-color:#fff}
.fzs-quellen{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:#9a9a9a}
.fzs-quellen a{color:#cfe6ff}
.fzs-leer{padding:60px 0;text-align:center;color:#8a8a8a}
@media (max-width:860px){.fzs{grid-template-columns:1fr}}
</style>

<script>
(function(){
  const nf = new Intl.NumberFormat("de-DE", {maximumFractionDigits:1});
  const esc = s=>String(s == null ? "" : s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const text = html=>{ const d = new DOMParser().parseFromString(String(html || ""), "text/html"); return (d.body.textContent || "").replace(/\s+/g, " ").trim(); };
  const norm = s=>String(s).toLowerCase().replace(/[^0-9a-z]/g, "");
  const name = decodeURIComponent((new URLSearchParams(location.search).get("n") || "").trim());
  const box = document.getElementById("fzs");
  const modName = m=>typeof m === "string" ? m : m.n;
  const modInfo = m=>`<b data-nolang>${esc(modName(m))}</b>${m.i ? ` – ${esc(m.i)}` : ""}`;

  // Titelbild des Wikipedia-Artikels (nur frei lizenzierte Bilder) samt Urheber und Lizenz von Wikimedia Commons
  const API = "https://en.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&action=query";
  const holen = q=>fetch(API + q).then(r=>r.ok ? r.json() : Promise.reject(r.status));
  function kennungen(f){ return (f.n + " " + (f.wiki || "")).split(/[\s\/„“()]+/).map(norm).filter(t=>t.length >= 3 && /[0-9]/.test(t)); }
  async function foto(f){
    let datei = null, artikel = null;
    if(f.wiki){ const r = await holen("&redirects=1&prop=pageimages&piprop=name&titles=" + encodeURIComponent(f.wiki));
      const p = r.query && r.query.pages && r.query.pages[0];
      if(p && !p.missing && p.pageimage){ datei = p.pageimage; artikel = p.title; } }
    if(!datei){ const k = kennungen(f); if(!k.length) return null;
      const r = await holen("&generator=search&gsrlimit=5&prop=pageimages&piprop=name&gsrsearch=" + encodeURIComponent(f.wiki || f.n));
      const p = ((r.query && r.query.pages) || []).sort((a, b)=>a.index - b.index).find(p=>p.pageimage && k.some(t=>norm(p.title).includes(t) || t.includes(norm(p.title))));
      if(!p) return null; datei = p.pageimage; artikel = p.title; }
    const r = await holen("&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1100&titles=" + encodeURIComponent("File:" + datei));
    const ii = r.query.pages[0].imageinfo && r.query.pages[0].imageinfo[0]; if(!ii) return null;
    const md = ii.extmetadata || {}, w = k=>md[k] ? text(md[k].value) : "";
    return {src:ii.thumburl || ii.url, datei:ii.descriptionurl, autor:w("Artist") || "unbekannt", lizenz:w("LicenseShortName") || "freie Lizenz",
      lizenzUrl:md.LicenseUrl ? md.LicenseUrl.value : "", beschr:w("ImageDescription").slice(0, 220), artikel};
  }

  function zeigen(D, f){
    const seite = f.seite.length > 1 ? "beide" : f.seite[0], mod = f.mod || [], typ = D.typen[f.typ].l;
    document.title = f.n + " · Plyus";
    document.getElementById("fzsName").textContent = f.n;
    document.getElementById("fzsTyp").textContent = typ;
    document.getElementById("fzsInfo").textContent = f.info || "";
    const bild = m=>window.FzBild(Object.assign({}, f.b, typeof m === "object" && m.b || {}), seite);
    const waffen = (f.km ? [`<li class="haupt"><span>Hauptwaffe: ${esc(f.reichweite)}</span><b>bis ${nf.format(f.km)} km</b></li>`] : [`<li><span>${esc(f.reichweite)}</span><b>–</b></li>`])
      .concat((f.w2l || []).map(w=>`<li><span>${esc(w.n)}</span><b>ca. ${nf.format(w.km)} km</b></li>`));
    if(f.w2 && !f.w2l) waffen.push(`<li><span>${esc(f.w2)}</span><b>–</b></li>`);
    const karte = f.km || f.fbkm ? `<a href="karte.html#fz=${encodeURIComponent(f.n)}">Auf der Karte einsetzen →</a>` : "";
    const wiki = f.wiki ? `<a href="https://en.wikipedia.org/wiki/${encodeURIComponent(f.wiki.replace(/ /g, "_"))}" target="_blank" rel="noopener">Wikipedia-Artikel</a>` : "";
    box.innerHTML = `<div class="fzs-box">
        <figure class="fzs-foto" id="fzsFoto"><div class="leer">Foto wird geladen …</div></figure>
        <div class="fzs-bild" id="fzsBild">${bild(mod[0])}</div>
        ${mod.length > 1 ? `<h2>Modelle (${mod.length})</h2><div class="fz-mod" role="group" aria-label="Modell wählen">${mod.map((m, i)=>`<button data-m="${i}"${i ? "" : ' class="on"'} aria-pressed="${!i}" data-nolang>${esc(modName(m))}</button>`).join("")}</div>` : ""}
        ${mod.length ? `<p class="fz-modinfo" id="fzsMod">${modInfo(mod[0])}</p>` : ""}
      </div>
      <div class="fzs-box">
        <div class="fz-seite">${f.seite.includes("ua") ? '<span class="ua">Ukraine</span>' : ""}${f.seite.includes("ru") ? '<span class="ru">Russland</span>' : ""}</div>
        <div class="fzs-werte"><div><span>Reichweite</span><b>${f.km ? "bis " + nf.format(f.km) + " km" : "–"}</b></div><div><span>Höchsttempo</span><b>${esc(f.d.v)}</b></div>
          <div><span>Fahrbereich</span><b>${esc(f.d.fb)}</b></div><div><span>Gewicht</span><b>${esc(f.d.m)}</b></div><div><span>Besatzung</span><b>${esc(f.d.bes)}</b></div><div><span>Modelle</span><b>${Math.max(1, mod.length)}</b></div></div>
        <h2>Bewaffnung</h2><ul class="fzs-waffen">${waffen.join("")}</ul>
        <h2>Steckbrief</h2>
        <dl><dt>Schutz</dt><dd>${esc(f.schutz)}</dd><dt>Kategorie</dt><dd>${esc(typ)}</dd><dt>Herkunft</dt><dd>${esc(f.land)}</dd><dt>Hersteller</dt><dd>${esc(f.hersteller)}</dd><dt>Nutzer</dt><dd>${esc(f.nutzer)}</dd>
          ${f.geber ? `<dt>Geliefert von</dt><dd class="fz-geber">${f.geber.map(g=>`<span>${esc(g)}</span>`).join("")}</dd>` : ""}</dl>
        <div class="fzs-knoepfe">${karte}${wiki}</div>
        <h2>Quellen</h2>
        <ol class="fzs-quellen" id="fzsQuellen">
          <li><a href="${f.seite.includes("ru") ? "https://www.oryxspioenkop.com/2022/02/attack-on-europe-documenting-equipment.html" : "https://www.oryxspioenkop.com/2022/02/attack-on-europe-documenting-ukrainian.html"}" target="_blank" rel="noopener">Oryx – fotobelegte Verluste</a></li>
          ${f.geber ? '<li><a href="https://www.oryxspioenkop.com/2022/04/answering-call-heavy-weaponry-supplied.html" target="_blank" rel="noopener">Oryx – Lieferungen an die Ukraine</a></li>' : ""}
          ${f.wiki ? `<li><a href="https://en.wikipedia.org/wiki/${encodeURIComponent(f.wiki.replace(/ /g, "_"))}" target="_blank" rel="noopener">Wikipedia – ${esc(f.wiki)}</a></li>` : ""}
        </ol>
      </div>`;
    const fig = document.getElementById("fzsFoto");
    foto(f).then(x=>{
      if(!x){ fig.innerHTML = '<div class="leer">Kein frei lizenziertes Foto gefunden – oben die gezeichnete Ansicht.</div>'; return; }
      fig.innerHTML = `<img src="${esc(x.src)}" alt="${esc(x.beschr || f.n)}" loading="lazy" referrerpolicy="no-referrer"><figcaption>${x.beschr ? esc(x.beschr) + "<br>" : ""}Foto: ${esc(x.autor)} · <a href="${esc(x.lizenzUrl || x.datei)}" target="_blank" rel="noopener">${esc(x.lizenz)}</a> · <a href="${esc(x.datei)}" target="_blank" rel="noopener">Wikimedia Commons</a>${x.artikel ? ` · Titelbild des Wikipedia-Artikels „${esc(x.artikel)}“` : ""}</figcaption>`;
      fig.querySelector("img").addEventListener("error", ()=>{ fig.innerHTML = '<div class="leer">Foto konnte nicht geladen werden.</div>'; });
      document.getElementById("fzsQuellen").insertAdjacentHTML("beforeend", `<li><a href="${esc(x.datei)}" target="_blank" rel="noopener">Foto: Wikimedia Commons</a></li>`);
    }).catch(()=>{ fig.innerHTML = '<div class="leer">Foto konnte nicht geladen werden.</div>'; });
    box.addEventListener("click", e=>{ const b = e.target.closest(".fz-mod button"); if(!b) return;
      const m = mod[+b.dataset.m];
      box.querySelectorAll(".fz-mod button").forEach(x=>{ x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });
      document.getElementById("fzsBild").innerHTML = bild(m); document.getElementById("fzsMod").innerHTML = modInfo(m); });
  }
  fetch("daten/fahrzeuge.json?v=202611232027").then(r=>r.json()).then(D=>{
    const f = D.fahrzeuge.find(x=>x.n === name);
    if(!f){ box.innerHTML = '<div class="fzs-leer">Fahrzeug nicht gefunden. <a href="fahrzeuge.html">Zur Liste →</a></div>'; return; }
    zeigen(D, f);
  }).catch(()=>{ box.innerHTML = '<div class="fzs-leer">Daten konnten nicht geladen werden.</div>'; });
})();
